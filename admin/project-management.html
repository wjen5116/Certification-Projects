<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Certification Tracker</title>
<style>
  :root{
    --bg:#000000;
    --card:#121212;
    --line:#333333;
    --ink:#FFFFFF;
    --ink-soft:#CCCCCC;
    --ink-faint:#999999;
    --pine:#8FCDB5;
    --pine-bg:#1F3B32;
    --gold:#E7C07E;
    --gold-bg:#3D2F14;
    --rust:#EC9B92;
    --rust-bg:#3D1F1B;
    --sage:#B3D2AA;
    --sage-bg:#233B22;
    --slate:#B3C4DA;
    --slate-bg:#25303D;
    --radius:10px;
    --serif: Calibri, "Segoe UI", Georgia, serif;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px) 60px;
  }
  .wrap{max-width:min(1200px, 96vw);margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:31px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{color:var(--ink-soft);font-size:16px;margin:0;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin:22px 0 26px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1;}
  .stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
  }
  .toolbar h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 14px;
    color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint);}
  .btn-primary{
    background:var(--pine);
    border-color:var(--pine);
    color:#0A1F19;
  }
  .btn-primary:hover{background:#7AB89E;}
  .btn-text{
    border:none;
    background:none;
    padding:4px 6px;
    color:var(--ink-soft);
    text-decoration:underline;
  }
  .btn-text.danger{color:var(--rust);}

  .empty{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty p{margin:0 0 14px;font-size:16px;}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:14px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:#1A1A1A;
    overflow-wrap:break-word;
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#1A1A1A;}
  .cert-name{font-weight:500;font-family:var(--serif);font-size:16px;}
  .muted{color:var(--ink-soft);}
  .pill{
    font-size:12px;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
    font-weight:600;
    display:inline-block;
  }
  .pill-notstarted{background:#2A2A2A;color:var(--ink-soft);}
  .pill-inprogress{background:var(--pine-bg);color:var(--pine);}
  .pill-submitted{background:var(--slate-bg);color:var(--slate);}
  .pill-underreview{background:var(--gold-bg);color:var(--gold);}
  .pill-approved{background:var(--sage-bg);color:var(--sage);}
  .pill-rejected{background:var(--rust-bg);color:var(--rust);}
  .pill-onhold{background:#2A2A2A;color:var(--ink-soft);}
  .pill-overdue{background:var(--rust-bg);color:var(--rust);}
  .pill-slate{background:var(--slate-bg);color:var(--slate);margin-right:6px;}
  .pill-gold{background:var(--gold-bg);color:var(--gold);margin-right:6px;}
  .pill-sage{background:var(--sage-bg);color:var(--sage);margin-right:6px;}
  .due-cell.overdue{color:var(--rust);font-weight:600;}
  .actions-cell{white-space:nowrap;}
  .change-cell{max-width:220px;}
  .doc-loc{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
    word-break:break-all;
    user-select:all;
  }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    border-bottom:1px solid var(--line);
    padding-bottom:0;
    margin-bottom:16px;
  }
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid transparent;
    border-bottom:none;
    border-radius:8px 8px 0 0;
    background:none;
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:15px;
    cursor:pointer;
  }
  .tab:hover{color:var(--ink);background:#1A1A1A;}
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--line);
    font-weight:500;
  }
  .tab.active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:var(--card);
  }
  .tab-count{
    font-size:12px;
    background:var(--slate-bg);
    color:var(--slate);
    padding:1px 7px;
    border-radius:99px;
    font-weight:600;
  }
  .tab-overdue-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--rust);
    display:inline-block;
  }
  .tab-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:6px 16px 14px;
  }
  .cgroup-add{padding-top:6px;}
  .cert-block{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cert-block:last-child{border-bottom:none;}
  .cert-block-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px 20px;
    margin-top:10px;
    font-size:14px;
  }
  .field-grid .fk{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .field-grid .fv{color:var(--ink);}
  .field-grid .full{grid-column:1 / -1;}
  .changelog{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .changelog-entry{
    display:flex;
    gap:10px;
    font-size:13px;
    padding:3px 0;
  }
  .changelog-date{
    color:var(--ink-faint);
    min-width:80px;
    flex-shrink:0;
  }
  .changelog-text{color:var(--ink-soft);}
  .activity-entry{
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .activity-entry:last-child{border-bottom:none;}
  .activity-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .activity-meta{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,36,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    max-width:min(520px, 92vw);
    width:100%;
  }
  .modal h3{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:16px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .err{color:var(--rust);font-size:13px;margin-top:4px;display:none;}
  .loading{color:var(--ink-soft);font-size:14px;padding:20px 0;}

  @media (max-width: 640px){
    .field-grid{grid-template-columns:1fr;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;}
    .tab{flex-shrink:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Customer Certification Tracker</h1>
    <p class="sub">Customer certifications by regulatory authority.</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <h2>Certifications</h2>
    <button class="btn-primary" id="add-btn">Add certification</button>
  </div>

  <div id="list"><div class="loading">Loading&hellip;</div></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Add certification</h3>
    <input type="hidden" id="edit-id">
    <div class="field">
      <label for="f-name">Certification / project name</label>
      <input id="f-name" placeholder="e.g. Type approval — Model X">
      <div class="err" id="err-name">Enter a name for this certification.</div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-customer">Customer</label>
        <input id="f-customer" placeholder="e.g. Acme Corp">
      </div>
      <div class="field">
        <label for="f-simlocation">SIM location</label>
        <input id="f-simlocation" placeholder="e.g. Phoenix, AZ, USA">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-authority">Regulatory authority</label>
        <input id="f-authority" placeholder="e.g. FCC, CE, FDA">
      </div>
      <div class="field">
        <label for="f-country">Certifying country</label>
        <input id="f-country" placeholder="e.g. Qatar">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-serial">SIM serial number</label>
        <input id="f-serial" placeholder="e.g. R-MCX-100251">
      </div>
      <div class="field">
        <label for="f-aircraft">Aircraft type</label>
        <input id="f-aircraft" placeholder="e.g. Piper PA-28-181 Archer">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-level">Certification level</label>
        <input id="f-level" placeholder="e.g. FNPT II, FTD Level 5">
      </div>
      <div class="field">
        <label for="f-date">Due date</label>
        <input id="f-date" type="date">
      </div>
    </div>
    <div class="field">
      <label for="f-docs">Documents (one per line)</label>
      <textarea id="f-docs" placeholder="e.g. MQTG v1.1.docx"></textarea>
    </div>
    <div class="field">
      <label for="f-doclocation">Document location</label>
      <input id="f-doclocation" placeholder="e.g. G:\Shared drives\Certification\...">
    </div>
    <div class="modal-actions">
      <button id="cancel-btn">Cancel</button>
      <button class="btn-primary" id="save-btn">Save</button>
    </div>
</div>

<div class="modal-bg" id="activity-modal-bg">
  <div class="modal">
    <h3 id="activity-modal-title">Add activity</h3>
    <input type="hidden" id="activity-cert-id">
    <input type="hidden" id="activity-edit-id">
    <div class="field">
      <label for="a-description">Description</label>
      <textarea id="a-description" placeholder="What needs to happen"></textarea>
      <div class="err" id="activity-err" style="display:none;">Enter a description.</div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="a-status">Status</label>
        <select id="a-status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Complete">Complete</option>
        </select>
      </div>
      <div class="field">
        <label for="a-due">Date due</label>
        <input id="a-due" type="date">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="a-created">Date created</label>
        <input id="a-created" type="date">
      </div>
    </div>
    <div class="modal-actions">
      <button id="activity-cancel-btn">Cancel</button>
      <button class="btn-primary" id="activity-save-btn">Save</button>
    </div>
  </div>
</div>

<script>
let certs = [];
let activeCustomer = null;
const STORAGE_KEY = 'certifications';

const DEFAULT_CUSTOMERS = ['Skyborn Airline Academy', 'US Aviation Academy', 'Superior Air', 'Aeroguard'];
const AUTHORITY_MAP = {

    docs: ['R-MCX-100251__PA28_Archer__UK_FNPTII_MQTG_v1_1.docx', 'Validation_Data_Roadmap__PA28_Archer_.docx'],
    docLocation: 'G:\\Shared drives\\Certification\\Non-EASA\\UK\\Skyborne\\2026\\QTG V3\\Skyborne Doc',

const CUSTOMER_CERT_SETS = {
  'aeroguard': [
    {

      country: 'Qatar',

    },
    {

      name: 'EASA FNPT II qualification \u2014 Redbird FMX/SD-E (Piper PA28-181, single-engine)',

      aircraft: 'Piper PA28-181',

      docLocation: 'G:\\Shared drives\\Certification\\Non-EASA\\Qatar\\Aeroguard\\954\\QTG Doc',
      country: 'Qatar',

    {

      docs: ['R-FMX-100953__DA42__EASA_FNPTII_-MEP.docx'],

function applyCertSets(){
  let changed = false;
  Object.keys(CUSTOMER_CERT_SETS).forEach(key => {
    const items = CUSTOMER_CERT_SETS[key];
    const haveAll = items.every(item => certs.some(c => c.id === item.id));
    if(!haveAll){
      const placeholderIdx = certs.findIndex(c =>
        (c.customer || '').trim().toLowerCase() === key &&
        / certification$/.test(c.name || '') &&
        !c.status && !c.change && !c.serial
      );
      if(placeholderIdx > -1) certs.splice(placeholderIdx, 1);
      items.forEach(item => {
        if(!certs.some(c => c.id === item.id)){
          const custName = DEFAULT_CUSTOMERS.find(n => n.toLowerCase() === key) || key;
          certs.push({
            id: item.id,
            name: item.name,
            customer: custName,
            authority: item.authority,
            status: item.status,
            date: '',
            change: item.change,
            docs: item.docs,
            docLocation: item.docLocation,
            serial: item.serial,
            aircraft: item.aircraft,
            country: item.country || '',
            simLocation: item.simLocation || '',
            level: item.level || '',
            activityLog: [],
            docChangeLog: [],
            _rev: 0,
            _setRev: item.rev || 0
          });
          changed = true;
        }
      });
    }
    items.forEach(item => {
      const existing = certs.find(c => c.id === item.id);
      if(!existing) return;
      if((existing._setRev || 0) < (item.rev || 0)){
        if(item.country !== undefined) existing.country = item.country || '';
        if(item.simLocation) existing.simLocation = item.simLocation;
        if(item.level) existing.level = item.level;
        if(item.docLocation) existing.docLocation = item.docLocation;
        if(item.authority) existing.authority = item.authority;
        if(item.serial) existing.serial = item.serial;
        if(item.change) existing.change = item.change;
        if(item.status) existing.status = item.status;
        existing._setRev = item.rev;
        changed = true;
      }
    });
  });
  return changed;
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    certs = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    certs = [];
  }
  if(certs.length === 0){
    certs = DEFAULT_CUSTOMERS.map((customer, i) => ({
      id: 'c' + Date.now() + i,
      name: customer + ' certification',
      customer,
      authority: AUTHORITY_MAP[customer.toLowerCase()] || '',
      status: '',
      date: '',
      change: '',
      docs: [],
      docLocation: '',
      serial: '',
      aircraft: '',
      country: '',
      simLocation: '',
      level: '',
      activityLog: [],
      docChangeLog: [],
      _rev: 0
    }));
    certs.forEach(c => {
      const key = (c.customer || '').trim().toLowerCase();
      const upd = RECORD_UPDATES[key];
      if(upd){
        if(upd.name) c.name = upd.name;
        if(upd.status) c.status = upd.status;
        if(upd.change) c.change = upd.change;
        if(upd.docs) c.docs = upd.docs;
        if(upd.docLocation) c.docLocation = upd.docLocation;
        if(upd.serial) c.serial = upd.serial;
        if(upd.aircraft) c.aircraft = upd.aircraft;
        if(upd.country !== undefined) c.country = upd.country || '';
        if(upd.simLocation) c.simLocation = upd.simLocation;
        if(upd.level) c.level = upd.level;
        c._rev = upd.rev;
      }
    });
    applyCertSets();
    await persist();
  }else{
    let changed = false;
    certs.forEach(c => {
      const key = (c.customer || '').trim().toLowerCase();
      if(!c.authority && AUTHORITY_MAP[key]){
        c.authority = AUTHORITY_MAP[key];
        changed = true;
      }
      const upd = RECORD_UPDATES[key];
      if(upd && (c._rev || 0) < upd.rev){
        if(upd.name) c.name = upd.name;
        if(upd.status) c.status = upd.status;
        if(upd.change) c.change = upd.change;
        if(upd.docs) c.docs = upd.docs;
        if(upd.docLocation) c.docLocation = upd.docLocation;
        if(upd.serial) c.serial = upd.serial;
        if(upd.aircraft) c.aircraft = upd.aircraft;
        if(upd.country !== undefined) c.country = upd.country || '';
        if(upd.simLocation) c.simLocation = upd.simLocation;
        if(upd.level) c.level = upd.level;
        c._rev = upd.rev;
        changed = true;
      }
      if(STATUS_LABELS[c.status]){
        c.status = STATUS_LABELS[c.status];
        changed = true;
      }
      if(Array.isArray(c.changeLog) && !c.activityLog){
        c.activityLog = c.changeLog;
        delete c.changeLog;
        changed = true;
      }
      if(!Array.isArray(c.activityLog)){
        c.activityLog = [];
        changed = true;
      }
      c.activityLog.forEach((a, idx) => {
        if(a.description === undefined){
          c.activityLog[idx] = {
            id: a.id || ('a' + Date.now() + idx),
            description: a.text || '',
            status: 'Complete',
            dateCreated: a.date || new Date().toISOString().slice(0,10),
            dateDue: '',
            dateUpdated: a.date || new Date().toISOString().slice(0,10)
          };
          changed = true;
        }else{
          if(!a.id){
            a.id = 'a' + Date.now() + idx;
            changed = true;
          }
          if(!a.status){
            a.status = 'Complete';
            changed = true;
          }
        }
      });
      if(!Array.isArray(c.docChangeLog)){
        c.docChangeLog = [];
        changed = true;
      }
      if(c.activityLog.length === 0 && c.status){
        const today = new Date().toISOString().slice(0,10);
        c.activityLog.push({date: today, text: 'To-do: ' + c.status});
        changed = true;
      }
    });
    if(applyCertSets()) changed = true;
    if(changed) await persist();
  }
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(certs), false);
  }catch(e){
    console.error('Storage error', e);
  }
}

const STATUS_LABELS = {
  'not-started':'Not started',
  'in-progress':'In progress',
  'submitted':'Submitted',
  'under-review':'Under review',
  'approved':'Approved',
  'rejected':'Rejected',
  'on-hold':'On hold'
};

function isOverdue(c){
  if(!c.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.date + 'T00:00:00');
  return d < today;
}

function fmtDate(d){
  if(!d) return '\u2014';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

function render(){
  const stats = document.getElementById('stats');
  const total = certs.length;
  const overdue = certs.filter(isOverdue).length;
  const dueSoon = certs.filter(c => {
    if(!c.date || isOverdue(c)) return false;
    const d = new Date(c.date + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;
  const noDate = certs.filter(c => !c.date).length;

  stats.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="n">${dueSoon}</div><div class="l">Due in 30 days</div></div>
    <div class="stat"><div class="n">${noDate}</div><div class="l">No due date</div></div>
  `;

  const list = document.getElementById('list');
  if(certs.length === 0){
    list.innerHTML = `<div class="empty"><p>No certifications yet. Add the first one you're tracking.</p><button class="btn-primary" onclick="openModal()">Add certification</button></div>`;
    return;
  }

  const groups = {};
  const order = [];
  certs.forEach(c => {
    const key = (c.customer || 'Unassigned').trim() || 'Unassigned';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });

  const CUSTOMER_ORDER = ['skyborn airline academy', 'skyborne airline academy', 'us aviation academy', 'aeroguard', 'superior air'];
  order.sort((a,b) => {
    const ai = CUSTOMER_ORDER.indexOf(a.trim().toLowerCase());
    const bi = CUSTOMER_ORDER.indexOf(b.trim().toLowerCase());
    const aRank = ai === -1 ? CUSTOMER_ORDER.length : ai;
    const bRank = bi === -1 ? CUSTOMER_ORDER.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.localeCompare(b);
  });

  if(!activeCustomer || !order.includes(activeCustomer)){
    activeCustomer = order[0];
  }

  const tabBar = order.map(customer => {
    const items = groups[customer];
    const anyOverdue = items.some(isOverdue);
    const isActive = customer === activeCustomer;
    return `
      <button class="tab ${isActive ? 'active' : ''}" onclick="selectCustomer('${escapeAttr(customer)}')">
        ${escapeHtml(customer)}
        <span class="tab-count">${items.length}</span>
        ${anyOverdue ? '<span class="tab-overdue-dot" aria-hidden="true"></span>' : ''}
      </button>
    `;
  }).join('');

  const activeItems = groups[activeCustomer] || [];

  list.innerHTML = `
    <div class="tabs" role="tablist">${tabBar}</div>
    <div class="tab-panel">
      ${activeItems.map(c => {
        const over = isOverdue(c);
        return `
        <div class="cert-block">
          <div class="cert-block-top">
            <span class="cert-name">${escapeHtml(c.name)}</span>
            <div class="cert-actions">
              <button class="btn-text" onclick="openModal('${c.id}')">Edit</button>
              <button class="btn-text danger" onclick="removeCert('${c.id}')">Delete</button>
            </div>
          </div>
          <div class="field-grid">
            <div>
              <div class="fk">SIM location</div>
              <div class="fv">${escapeHtml(c.simLocation || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Certifying country</div>
              <div class="fv">${escapeHtml(c.country || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Regulatory authority</div>
              <div class="fv">${escapeHtml(c.authority || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">SIM serial number</div>
              <div class="fv">${escapeHtml(c.serial || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Aircraft type</div>
              <div class="fv">${escapeHtml(c.aircraft || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Certification level</div>
              <div class="fv">${escapeHtml(c.level || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Due date</div>
              <div class="fv ${over ? 'due-cell overdue' : ''}">${fmtDate(c.date)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}</div>
            </div>
            <div class="full">
              <div class="fk">Documents</div>
              <div class="fv">${(c.docs && c.docs.length) ? c.docs.map(escapeHtml).join('<br>') : '\u2014'}${c.docLocation ? `<div class="doc-loc">${escapeHtml(c.docLocation)}</div>` : ''}</div>
            </div>
          </div>
          ${renderDocChangeLog(c)}
          ${renderActivityLog(c)}
        </div>
      `; }).join('')}
      <div class="cgroup-add">
        <button class="btn-text" onclick="openModal(null, '${escapeAttr(activeCustomer)}')">+ Add certification for ${escapeHtml(activeCustomer)}</button>
      </div>
    </div>
  `;
}

function selectCustomer(name){
  activeCustomer = name;
  render();
}

function escapeAttr(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function isValidDateStr(s){
  return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime());
}

function renderDocChangeLog(c){
  const entries = Array.isArray(c.docChangeLog) ? c.docChangeLog : [];
  const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date));
  return `
    <div class="changelog">
      <div class="fk">Document Change Log</div>
      ${sorted.length ? sorted.map(entry => `
        <div class="changelog-entry">
          <span class="changelog-date">${fmtDate(entry.date)}</span>
          <span class="changelog-text">${escapeHtml(entry.text)}</span>
        </div>
      `).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No entries yet</span></div>'}
    </div>
  `;
}

function isActivityOverdue(a){
  if(!a.dateDue) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(a.dateDue + 'T00:00:00') < today;
}

function activityStatusClass(status){
  if(status === 'Complete') return 'sage';
  if(status === 'In Progress') return 'gold';
  return 'slate';
}

function renderActivityLog(c){
  const entries = Array.isArray(c.activityLog) ? c.activityLog : [];
  const sorted = [...entries].sort((a,b) => {
    const aDone = a.status === 'Complete' ? 1 : 0;
    const bDone = b.status === 'Complete' ? 1 : 0;
    if(aDone !== bDone) return aDone - bDone;
    const ad = a.dateDue || a.dateCreated || '';
    const bd = b.dateDue || b.dateCreated || '';
    return aDone === 0 ? ad.localeCompare(bd) : bd.localeCompare(ad);
  });
  return `
    <div class="changelog">
      <div class="fk" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Activities</span>
        <button class="btn-text" onclick="openActivityModal('${c.id}')">+ Add</button>
      </div>
      ${sorted.length ? sorted.map(a => {
        const over = isActivityOverdue(a);
        const status = a.status || 'Pending';
        const cls = activityStatusClass(status);
        return `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <div>
              <span class="pill pill-${cls}">${escapeHtml(status)}</span>
              <span class="changelog-text">${escapeHtml(a.description)}</span>
            </div>
            <div class="cert-actions">
              ${status !== 'Complete' ? `<button class="btn-text" onclick="markActivityComplete('${c.id}', '${a.id}')">\u2713 Complete</button>` : ''}
              <button class="btn-text" onclick="openActivityModal('${c.id}', '${a.id}')">Edit</button>
              <button class="btn-text danger" onclick="deleteActivity('${c.id}', '${a.id}')">Delete</button>
            </div>
          </div>
          <div class="activity-meta">
            Created ${fmtDate(a.dateCreated)}
            ${a.dateDue ? ` \u00b7 Due ${fmtDate(a.dateDue)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}` : ''}
            ${a.dateUpdated && a.dateUpdated !== a.dateCreated ? ` \u00b7 Updated ${fmtDate(a.dateUpdated)}` : ''}
          </div>
        </div>
      `; }).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No activities yet</span></div>'}
    </div>
  `;
}

async function markActivityComplete(certId, activityId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.activityLog)) return;
  const a = c.activityLog.find(x => x.id === activityId);
  if(!a) return;
  a.status = 'Complete';
  a.dateUpdated = new Date().toISOString().slice(0,10);
  await persist();
  render();
}

function openActivityModal(certId, activityId){
  document.getElementById('activity-err').style.display = 'none';
  document.getElementById('activity-cert-id').value = certId;
  document.getElementById('activity-edit-id').value = activityId || '';
  const title = document.getElementById('activity-modal-title');
  const today = new Date().toISOString().slice(0,10);
  if(activityId){
    const c = certs.find(x => x.id === certId);
    const a = c && Array.isArray(c.activityLog) ? c.activityLog.find(x => x.id === activityId) : null;
    title.textContent = 'Edit activity';
    document.getElementById('a-description').value = a ? a.description : '';
    document.getElementById('a-status').value = a ? (a.status || 'Pending') : 'Pending';
    document.getElementById('a-created').value = a ? a.dateCreated : today;
    document.getElementById('a-due').value = a ? (a.dateDue || '') : '';
  }else{
    title.textContent = 'Add activity';
    document.getElementById('a-description').value = '';
    document.getElementById('a-status').value = 'Pending';
    document.getElementById('a-created').value = today;
    document.getElementById('a-due').value = '';
  }
  document.getElementById('activity-modal-bg').classList.add('open');
  document.getElementById('a-description').focus();
}

function closeActivityModal(){
  document.getElementById('activity-modal-bg').classList.remove('open');
}

async function saveActivityEntry(){
  const description = document.getElementById('a-description').value.trim();
  if(!description){
    document.getElementById('activity-err').style.display = 'block';
    return;
  }
  const certId = document.getElementById('activity-cert-id').value;
  const activityId = document.getElementById('activity-edit-id').value;
  const today = new Date().toISOString().slice(0,10);
  let dateCreated = document.getElementById('a-created').value;
  if(!isValidDateStr(dateCreated)) dateCreated = today;
  const dateDueRaw = document.getElementById('a-due').value;
  const dateDue = isValidDateStr(dateDueRaw) ? dateDueRaw : '';
  const status = document.getElementById('a-status').value || 'Pending';

  const c = certs.find(x => x.id === certId);
  if(!c) return;
  if(!Array.isArray(c.activityLog)) c.activityLog = [];

  if(activityId){
    const idx = c.activityLog.findIndex(x => x.id === activityId);
    if(idx > -1){
      c.activityLog[idx] = {
        ...c.activityLog[idx],
        description, status, dateCreated, dateDue,
        dateUpdated: today
      };
    }
  }else{
    c.activityLog.push({
      id: 'a' + Date.now(),
      description, status, dateCreated, dateDue,
      dateUpdated: dateCreated
    });
  }
  await persist();
  closeActivityModal();
  render();
}

async function deleteActivity(certId, activityId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.activityLog)) return;
  c.activityLog = c.activityLog.filter(a => a.id !== activityId);
  await persist();
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openModal(id, prefillCustomer){
  document.getElementById('err-name').style.display = 'none';
  const modal = document.getElementById('modal-bg');
  const title = document.getElementById('modal-title');
  if(id){
    const c = certs.find(x => x.id === id);
    title.textContent = 'Edit certification';
    document.getElementById('edit-id').value = c.id;
    document.getElementById('f-name').value = c.name;
    document.getElementById('f-customer').value = c.customer || '';
    document.getElementById('f-authority').value = c.authority || '';
    document.getElementById('f-country').value = c.country || '';
    document.getElementById('f-simlocation').value = c.simLocation || '';
    document.getElementById('f-serial').value = c.serial || '';
    document.getElementById('f-aircraft').value = c.aircraft || '';
    document.getElementById('f-level').value = c.level || '';
    document.getElementById('f-date').value = c.date || '';
    document.getElementById('f-docs').value = (c.docs || []).join('\n');
    document.getElementById('f-doclocation').value = c.docLocation || '';
  }else{
    title.textContent = 'Add certification';
    document.getElementById('edit-id').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-customer').value = prefillCustomer || '';
    document.getElementById('f-authority').value = '';
    document.getElementById('f-country').value = '';
    document.getElementById('f-simlocation').value = '';
    document.getElementById('f-serial').value = '';
    document.getElementById('f-aircraft').value = '';
    document.getElementById('f-level').value = '';
    document.getElementById('f-date').value = '';
    document.getElementById('f-docs').value = '';
    document.getElementById('f-doclocation').value = '';
  }
  modal.classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
}

async function saveCert(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){
    document.getElementById('err-name').style.display = 'block';
    return;
  }
  const id = document.getElementById('edit-id').value;
  const data = {
    name,
    customer: document.getElementById('f-customer').value.trim(),
    authority: document.getElementById('f-authority').value.trim(),
    country: document.getElementById('f-country').value.trim(),
    simLocation: document.getElementById('f-simlocation').value.trim(),
    serial: document.getElementById('f-serial').value.trim(),
    aircraft: document.getElementById('f-aircraft').value.trim(),
    level: document.getElementById('f-level').value.trim(),
    date: document.getElementById('f-date').value,
    docs: document.getElementById('f-docs').value.split('\n').map(s => s.trim()).filter(Boolean),
    docLocation: document.getElementById('f-doclocation').value.trim()
  };

  if(id){
    const idx = certs.findIndex(c => c.id === id);
    if(idx > -1){
      const prev = certs[idx];
      const today = new Date().toISOString().slice(0,10);
      const docEntries = [];
      const prevDocs = (prev.docs || []).join('\n');
      const newDocs = data.docs.join('\n');
      if(newDocs !== prevDocs && data.docs.length){
        docEntries.push({date: today, text: 'Documents updated: ' + data.docs.join(', ')});
      }
      if(data.docLocation !== prev.docLocation && data.docLocation){
        docEntries.push({date: today, text: 'Document location updated: ' + data.docLocation});
      }
      certs[idx] = {...prev, ...data};
      if(!Array.isArray(certs[idx].activityLog)) certs[idx].activityLog = [];
      if(!Array.isArray(certs[idx].docChangeLog)) certs[idx].docChangeLog = [];
      certs[idx].docChangeLog.push(...docEntries);
    }
  }else{
    certs.push({id: 'c' + Date.now(), ...data, activityLog: [], docChangeLog: []});
  }
  await persist();
  closeModal();
  render();
}

async function removeCert(id){
  certs = certs.filter(c => c.id !== id);
  await persist();
  render();
}

document.getElementById('add-btn').addEventListener('click', () => openModal());
document.getElementById('cancel-btn').addEventListener('click', closeModal);
document.getElementById('save-btn').addEventListener('click', saveCert);
document.getElementById('modal-bg').addEventListener('click', (e) => {
  if(e.target.id === 'modal-bg') closeModal();
});
document.getElementById('activity-cancel-btn').addEventListener('click', closeActivityModal);
document.getElementById('activity-save-btn').addEventListener('click', saveActivityEntry);
document.getElementById('activity-modal-bg').addEventListener('click', (e) => {
  if(e.target.id === 'activity-modal-bg') closeActivityModal();
});

load();
</script>
</body>
</html>
