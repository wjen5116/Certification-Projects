<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification Project Tracker</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#F3F4F5;
    --card:#FFFFFF;
    --card-line:#A70E13;
    --line:#D8DCDF;
    --line-strong:#B4BBC0;
    --hover:#E1E5E8;
    --neutral-bg:#E6E9EB;
    --backdrop:rgba(20,24,27,0.45);
    --ink:#23292E;
    --ink-soft:#4A545B;
    --ink-faint:#6A747B;
    --accent:#A70E13;
    --accent-hover:#8C0B10;
    --accent-ink:#A70E13;
    --hover-ink:#A70E13;
    --accent-bg:#FBE8E9;
    --on-accent:#FFFFFF;
    --rust:#C2410C;
    --rust-bg:#FFEDD5;
    --rust-strong:#9A3409;
    --rust-bg-strong:#FFE0C2;
    --gold:#875A00;
    --gold-bg:#FCEFD3;
    --sage:#2E6A2A;
    --sage-bg:#E2F0DE;
    --sage-strong:#1F4D1C;
    --sage-bg-strong:#CFE6C8;
    --slate:#2E5A88;
    --slate-bg:#E2EBF5;
    --radius:10px;
    --serif: Calibri, "Segoe UI", Georgia, serif;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#353D43;
      --card-line:#A70E13;
      --line:#4A545B;
      --line-strong:#7C8790;
      --hover:#434C53;
      --neutral-bg:#454E55;
      --backdrop:rgba(0,0,0,0.6);
      --ink:#FFFFFF;
      --ink-soft:#E4E8EB;
      --ink-faint:#B8C1C7;
      --accent:#A70E13;
      --accent-hover:#C0151B;
      --accent-ink:#FF6B6F;
      --hover-ink:#FF6B6F;
      --accent-bg:#4A2A2E;
      --on-accent:#FFFFFF;
      --rust:#FF9D66;
      --rust-bg:#4E3325;
      --rust-strong:#FFB085;
      --rust-bg-strong:#4E3325;
      --gold:#E7C07E;
      --gold-bg:#4A3D22;
      --sage:#C6E0BE;
      --sage-bg:#2E4630;
      --sage-strong:#D6EBCF;
      --sage-bg-strong:#3A5A3C;
      --slate:#C9D6E6;
      --slate-bg:#2E3C4B;
    }
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  a{color:var(--accent-ink);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px) 60px;
  }
  .wrap{max-width:min(1200px, 96vw);margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:31px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{color:var(--ink-soft);font-size:16px;margin:0;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin:22px 0 26px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1;}
  .stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
  }
  .toolbar h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 14px;
    color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint);}

  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--on-accent);
  }
  .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .btn-text{
    display:inline-flex;
    align-items:center;
    gap:5px;
    height:28px;
    padding:0 10px;
    font-size:13px;
    line-height:1;
    border-radius:6px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  
  .btn-text svg{width:15px;height:15px;flex-shrink:0;}
  .btn-text.danger{color:var(--rust);border-color:var(--rust);}
  
  .btn-text.ok{color:var(--sage);border-color:var(--sage);background:var(--sage-bg);}
  
  .cert-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .detail-actions{gap:6px;}
  @media (max-width: 640px){
    .btn-text.compact .btn-label{display:none;}
    .btn-text{height:34px;}
    .btn-text.compact{padding:0;width:34px;justify-content:center;}
  }

  .empty{
    background:var(--card);
    border:1px dashed var(--card-line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty p{margin:0 0 14px;font-size:16px;}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:14px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:var(--hover);
    overflow-wrap:break-word;
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--hover);}
  .cert-name{font-weight:500;font-family:var(--serif);font-size:16px;}
  .muted{color:var(--ink-soft);}
  .pill{
    font-size:12px;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
    font-weight:600;
    display:inline-block;
  }
  .pill-notstarted{background:var(--neutral-bg);color:var(--ink-soft);}
  .pill-inprogress{background:var(--accent-bg);color:var(--accent-ink);}
  .pill-submitted{background:var(--slate-bg);color:var(--slate);}
  .pill-underreview{background:var(--gold-bg);color:var(--gold);}
  .pill-approved{background:var(--sage-bg);color:var(--sage);}
  .pill-rejected{background:var(--rust-bg);color:var(--rust);}
  .pill-onhold{background:var(--neutral-bg);color:var(--ink-soft);}
  .pill-overdue{background:var(--rust-bg);color:var(--rust);}
  .pill-slate{background:var(--slate-bg);color:var(--slate);margin-right:6px;}
  .pill-gold{background:var(--gold-bg);color:var(--gold);margin-right:6px;}
  .pill-sage{background:var(--sage-bg);color:var(--sage);margin-right:6px;}
  .due-cell.overdue{color:var(--rust);font-weight:600;}
  .actions-cell{white-space:nowrap;}
  .change-cell{max-width:220px;}
  .doc-loc{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
    word-break:break-all;
    user-select:all;
  }
  .doc-loc a{color:var(--accent-ink);text-decoration:underline;}
  .field-grid .fv a{color:var(--accent-ink);text-decoration:underline;}

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    border-bottom:1px solid var(--line);
    padding-bottom:0;
    margin-bottom:16px;
  }
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid transparent;
    border-bottom:none;
    border-radius:8px 8px 0 0;
    background:none;
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:15px;
    cursor:pointer;
  }
  
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--line);
    font-weight:500;
  }
  .tab.active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:var(--card);
  }
  .tab-count{
    font-size:12px;
    background:var(--slate-bg);
    color:var(--slate);
    padding:1px 7px;
    border-radius:99px;
    font-weight:600;
  }
  .tab-overdue-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--rust);
    display:inline-block;
  }
  .tab-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:6px 16px 14px;
  }
  .cgroup-add{padding-top:6px;}
  .cert-block{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cert-block:last-child{border-bottom:none;}
  .cert-block-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .cert-collapse-toggle{
    width:100%;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    color:var(--ink);
  }
  .cert-collapse-toggle:hover .cert-name{color:var(--accent-ink);}
  .cert-collapse-toggle .chevron{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    margin-right:6px;
    transition:transform 0.15s ease;
  }
  .cert-collapse-toggle .chevron.open{transform:rotate(90deg);}
  .serial-heading{
    font-family:var(--serif);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:16px 0 4px;
  }
  .serial-heading:first-child{margin-top:0;}
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px 20px;
    margin-top:10px;
    font-size:14px;
  }
  .field-grid .fk{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .field-grid .fv{color:var(--ink);}
  .field-grid .full{grid-column:1 / -1;}
  .changelog{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .changelog-entry{
    display:flex;
    gap:10px;
    font-size:15px;
    padding:3px 0;
  }
  .changelog-date{
    font-size:13px;
    padding-top:1px;
    color:var(--ink-faint);
    min-width:80px;
    flex-shrink:0;
  }
  .changelog-text{color:var(--ink-soft);}
  .activity-entry{
    font-size:15px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .activity-entry:last-child{border-bottom:none;}
  .activity-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .changelog-editable{justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding:5px 0;}
  .changelog-editable:last-child{border-bottom:none;}
  .changelog-main{display:flex;gap:10px;min-width:0;overflow-wrap:anywhere;}
  .changelog-editable .cert-actions{flex-shrink:0;}
  .late-note{color:var(--ink-faint);font-style:italic;}
  .activity-meta{
    font-size:13px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .modal-bg{
    position:fixed;inset:0;
    background:var(--backdrop);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    max-width:min(520px, 92vw);
    width:100%;
  }
  .modal h3{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:16px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .err{color:var(--rust);font-size:13px;margin-top:4px;display:none;}
  .loading{color:var(--ink-soft);font-size:14px;padding:20px 0;}

  @media (max-width: 640px){
    .field-grid{grid-template-columns:1fr;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;}
    .tab{flex-shrink:0;}
  }
  .sync-banner{
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .sync-banner.info{background:var(--slate-bg);color:var(--slate);border-color:var(--slate);}
  .sync-banner.error{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}
  .sync-banner.success{background:var(--sage-bg);color:var(--sage);border-color:var(--sage);}
  .sync-banner a{color:inherit;text-decoration:underline;}
  .version-footer{
    margin-top:24px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--ink-faint);
    text-align:center;
  }
  /* v2.2.0 sidebar layout */
  .layout{
    display:grid;
    grid-template-columns:minmax(220px, 290px) minmax(0, 1fr);
    gap:16px;
    align-items:start;
  }
  .sidebar{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:6px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  .side-customer-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    border-radius:8px;
    padding:10px;
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink-soft);
    text-align:left;
  }
  
  .side-customer.has-active .side-customer-btn{color:var(--ink);font-weight:700;}
  .side-customer-name{flex:1;min-width:0;overflow-wrap:break-word;}
  .sidebar .chevron{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    transition:transform 0.15s ease;
  }
  .sidebar .chevron.open{transform:rotate(90deg);}
  .side-certs{padding:0 0 8px 18px;}
  .side-serial{
    font-size:11px;
    font-weight:600;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:8px 10px 2px;
  }
  .side-cert{
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:none;
    border:none;
    border-radius:6px;
    padding:7px 10px;
    font-size:14px;
    color:var(--ink-soft);
    text-align:left;
  }
  
  .side-cert.active{color:var(--ink);font-weight:700;}
  .side-cert-name{flex:1;min-width:0;overflow-wrap:break-word;}
  .side-cert-auth{display:block;font-size:13px;color:var(--ink-faint);}
  .side-cert.active .side-cert-auth{color:var(--ink-soft);font-weight:700;}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
  .dot-overdue{background:var(--rust);}
  .dot-gold{background:var(--gold);}
  .dot-slate{background:var(--slate);}
  .dot-sage{background:var(--sage);}
  .side-add{margin:6px 0 2px 10px;}
  .detail{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:16px 20px 18px;
    min-width:0;
    scroll-margin-top:12px;
  }
  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .detail-context{font-size:13px;color:var(--ink-faint);margin-bottom:2px;}
  .detail-title{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0;
    line-height:1.2;
  }
  .activity-entry-top > :first-child{min-width:0;overflow-wrap:anywhere;}
  .activity-entry-top .cert-actions{flex-shrink:0;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    padding:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--accent-ink);
  }
  .detail-actions{display:flex;justify-content:flex-end;margin-top:4px;}
  button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}
  @media (max-width: 760px){
    .layout{grid-template-columns:1fr;}
    .sidebar{position:static;max-height:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .sidebar .chevron{transition:none;}
  }
  /* Hover: grey shading; customer names turn bold Redbird red; button borders take their color */
  .side-customer-btn:hover{background:var(--hover);}
  .side-customer-btn:hover .side-customer-name{color:var(--hover-ink);font-weight:700;}
  .side-cert:hover{background:var(--hover);}
  .btn-text:hover{background:var(--hover);color:var(--ink);border-color:var(--hover-ink);}
  .btn-text.danger:hover{background:var(--rust-bg-strong);color:var(--rust);border-color:var(--rust-strong);}
  .btn-text.ok:hover{background:var(--sage-bg-strong);color:var(--sage);border-color:var(--sage-strong);}
  .icon-btn:hover{background:var(--hover);}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>Certification Project Tracker</h1>
  </header>

  <div class="stats" id="stats"></div>

  <div id="sync-banner" class="sync-banner" style="display:none;"></div>

  <div class="toolbar">
    <h2>Certifications</h2>
  </div>

  <div id="list"><div class="loading">Loading&hellip;</div></div>
  <div class="version-footer">v2.4.1</div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Add certification</h3>
    <input type="hidden" id="edit-id">
    <div class="field">
      <label for="f-name">Certification / project name</label>
      <input id="f-name" placeholder="e.g. Type approval — Model X">
      <div class="err" id="err-name">Enter a name for this certification.</div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-customer">Customer</label>
        <input id="f-customer" placeholder="e.g. Acme Corp">
      </div>
      <div class="field">
        <label for="f-simlocation">SIM location</label>
        <input id="f-simlocation" placeholder="e.g. Phoenix, AZ, USA">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-authority">Regulatory authority</label>
        <input id="f-authority" placeholder="e.g. FCC, CE, FDA">
      </div>
      <div class="field">
        <label for="f-country">Certifying country</label>
        <input id="f-country" placeholder="e.g. Qatar">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-serial">SIM serial number</label>
        <input id="f-serial" placeholder="e.g. R-MCX-100251">
      </div>
      <div class="field">
        <label for="f-aircraft">Aircraft type</label>
        <input id="f-aircraft" placeholder="e.g. Piper PA-28-181 Archer">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-level">Certification level</label>
        <input id="f-level" placeholder="e.g. FNPT II, FTD Level 5">
      </div>
      <div class="field">
        <label for="f-date">Due date</label>
        <input id="f-date" type="date">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-contact">Primary contact</label>
        <input id="f-contact" placeholder="e.g. Jane Smith, jane@customer.com">
      </div>
    </div>
    <div class="modal-actions">
      <button id="cancel-btn">Cancel</button>
      <button class="btn-primary" id="save-btn">Save</button>
    </div>

function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

// Sign-in lives on the view-only page (index.html); send the user there when
// there are no saved credentials or GitHub rejects them.
function redirectToSignIn(reason){
  location.replace('index.html?settings=1' + (reason ? '&reason=' + encodeURIComponent(reason) : ''));
}

function saveSettings(cfg){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
}

function showBanner(kind, html){
  const el = document.getElementById('sync-banner');
  el.className = 'sync-banner ' + kind;
  el.innerHTML = html;
  el.style.display = 'block';
}

function hideBanner(){
  document.getElementById('sync-banner').style.display = 'none';
}

// UTF-8 safe base64 encode/decode
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + ghConfig.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

function ghUrl(){
  return `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${encodeURIComponent(ghConfig.path).replace(/%2F/g,'/')}`;
}

async function fetchFromGitHub(){
  const res = await fetch(ghUrl() + `?ref=${encodeURIComponent(ghConfig.branch)}`, {
    headers: ghHeaders()
  });
  if(res.status === 404){
    return null; // file doesn't exist yet
  }
  if(!res.ok){
    const body = await res.text();
    const err = new Error(`GitHub read failed (${res.status}): ${body.slice(0,200)}`);
    err.status = res.status;
    throw err;
  }
  const json = await res.json();
  currentSha = json.sha;
  const content = b64DecodeUtf8(json.content.replace(/\n/g,''));
  return JSON.parse(content);
}

async function writeToGitHub(data, message){
  const body = {
    message: message || 'Update certification tracker data',
    content: b64EncodeUtf8(JSON.stringify(data, null, 2)),
    branch: ghConfig.branch
  };
  if(currentSha) body.sha = currentSha;
  const res = await fetch(ghUrl(), {
    method: 'PUT',
    headers: {...ghHeaders(), 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errBody = await res.text();
    if(res.status === 401 || res.status === 403){
      throw new Error('GitHub rejected the saved token. <a href="index.html?settings=1&reason=rejected">Reconnect from the view-only page</a>, then try again.');
    }
    if(res.status === 409){
      throw new Error('Conflict: the file changed on GitHub since last load. Refresh the page to get the latest version before saving again.');
    }
    throw new Error(`GitHub write failed (${res.status}): ${errBody.slice(0,300)}`);
  }
  const json = await res.json();
  currentSha = json.content.sha;
}

async function persist(){
  if(!ghConfig){
    showBanner('error', 'Not connected to GitHub. <a href="index.html?settings=1">Connect from the view-only page</a>.');
    return;
  }
  try{
    showBanner('info', 'Saving to GitHub&hellip;');
    await writeToGitHub(certs);
    showBanner('success', 'Saved to GitHub.');
    setTimeout(hideBanner, 2000);
  }catch(e){
    const msg = e.message.startsWith('GitHub rejected the saved token.') ? e.message : escapeHtml(e.message);
    showBanner('error', 'Save failed: ' + msg);
  }
}

async function load(){
  ghConfig = loadSettings();
  if(!ghConfig || !ghConfig.owner || !ghConfig.repo || !ghConfig.token){
    redirectToSignIn();
    return;
  }
  try{
    showBanner('info', 'Loading from GitHub&hellip;');
    const remote = await fetchFromGitHub();
    let needsResave = false;
    if(remote === null){
      // First time: seed the file with starting data
      certs = SEED_DATA;
      currentSha = null;
      needsResave = true;
    }else{
      certs = remote;
    }
    certs.forEach((c, ci) => {
      if(!Array.isArray(c.activityLog)) c.activityLog = [];
      const today = new Date().toISOString().slice(0,10);
      // Migrate legacy {date, text} activity entries to the new shape.
      c.activityLog.forEach((a, idx) => {
        if(a.description === undefined){
          c.activityLog[idx] = {
            id: a.id || ('a' + Date.now() + ci + idx),
            description: a.text || '',
            status: 'Complete',
            dateCreated: a.date || today,
            dateDue: '',
            dateUpdated: a.date || today,
            dateCompleted: a.date || today
          };
          needsResave = true;
        }else{
          if(!a.id){ a.id = 'a' + Date.now() + ci + idx; needsResave = true; }
          if(!a.status){ a.status = 'Complete'; needsResave = true; }
          if(a.status === 'Complete' && !a.dateCompleted){
            a.dateCompleted = a.dateUpdated || a.dateCreated || today;
            needsResave = true;
          }
        }
      });
      // Fold any leftover "Next task" text into a new Pending activity.
      if(c.change && c.change.trim()){
        c.activityLog.push({
          id: 'a' + Date.now() + ci + '-migrated',
          description: c.change.trim(),
          status: 'Pending',
          dateCreated: today,
          dateDue: '',
          dateUpdated: today
        });
        c.change = '';
        needsResave = true;
      }
      if(!Array.isArray(c.docChangeLog)){ c.docChangeLog = []; needsResave = true; }
      c.docChangeLog.forEach((e, ei) => {
        if(!e.id){ e.id = 'l' + Date.now() + ci + '-' + ei; needsResave = true; }
      });
      if(Array.isArray(c.docs)){
        const normalized = c.docs.map(d => typeof d === 'string' ? {name: d, url: ''} : d);
        const isDifferent = normalized.some((d, i) => typeof c.docs[i] === 'string');
        if(isDifferent){ c.docs = normalized; needsResave = true; }
        c.docs.forEach((d, di) => {
          if(!d.id){ d.id = 'd' + Date.now() + ci + di; needsResave = true; }
        });
      }else{
        c.docs = [];
        needsResave = true;
      }
    });
    if(needsResave){
      showBanner('info', remote === null ? 'No data file found yet \u2014 creating one with starting data&hellip;' : 'Updating data format&hellip;');
      await writeToGitHub(certs, remote === null ? 'Initialize certification tracker data' : 'Merge Next Task into Activities');
      showBanner('success', remote === null ? 'Created data file in your repo.' : 'Data updated.');
      setTimeout(hideBanner, 2500);
    }else{
      hideBanner();
    }
  }catch(e){
    if(e.status === 401 || e.status === 403){
      redirectToSignIn('rejected');
      return;
    }
    showBanner('error', 'Could not load from GitHub: ' + escapeHtml(e.message));
    certs = [];
  }
  render();
}

function isOverdue(c){
  if(!c.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.date + 'T00:00:00');
  return d < today;
}

function fmtDate(d){
  if(!d) return '\u2014';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

let logIdCounter = 0;
function newLogId(){
  return 'l' + Date.now() + '-' + (logIdCounter++);
}

function nowTime(){

}

          </div>

function isCertOverdue(c){
  if(isOverdue(c)) return true;
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  return acts.some(isActivityOverdue);
}

function computeCertStatus(c){
  if(isCertOverdue(c)) return {label: 'Overdue', cls: 'overdue'};
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  if(acts.length === 0) return {label: 'No Activity', cls: 'slate'};
  const anyOpen = acts.some(a => a.status !== 'Complete');
  if(anyOpen) return {label: 'In Progress', cls: 'gold'};
  return {label: 'On Track', cls: 'sage'};
}

function sortCerts(items){
  return [...items].sort((a,b) => {
    const aOver = isCertOverdue(a) ? 0 : 1;
    const bOver = isCertOverdue(b) ? 0 : 1;
    if(aOver !== bOver) return aOver - bOver;
    const ad = a.date || '9999-99-99';
    const bd = b.date || '9999-99-99';
    return ad.localeCompare(bd);
  });
}

function groupBySerial(items){
  const groups = {};
  const order = [];
  items.forEach(c => {
    const key = c.serial || 'No serial number';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });
  return { groups, order };
}

// For completed activities: how many days after the due date they were completed ('' if on time or unknown).
function lateNote(a){
  if(a.status !== 'Complete' || !a.dateDue || !a.dateCompleted) return '';
  const days = Math.round((new Date(a.dateCompleted + 'T00:00:00') - new Date(a.dateDue + 'T00:00:00')) / 86400000);
  if(days <= 0) return '';
  return ` <span class="late-note">(${days} day${days === 1 ? '' : 's'} late)</span>`;
}

function isActivityOverdue(a){
  if(a.status === 'Complete') return false;
  if(!a.dateDue) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(a.dateDue + 'T00:00:00') < today;
}

function activityStatusClass(status){
  if(status === 'Complete') return 'sage';
  if(status === 'In Progress') return 'gold';
  return 'slate';
}

function renderActivityLog(c){
  const entries = Array.isArray(c.activityLog) ? c.activityLog : [];
  const sorted = [...entries].sort((a,b) => {
    const aDone = a.status === 'Complete' ? 1 : 0;
    const bDone = b.status === 'Complete' ? 1 : 0;
    if(aDone !== bDone) return aDone - bDone;
    const ad = a.dateDue || a.dateCreated || '';
    const bd = b.dateDue || b.dateCreated || '';
    return aDone === 0 ? ad.localeCompare(bd) : bd.localeCompare(ad);
  });
  return `
    <div class="changelog">
      <div class="fk" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Activities</span>
        ${actionBtn('plus', 'Add', `openActivityModal('${c.id}')`, {compact: false})}
      </div>
      ${sorted.length ? sorted.map(a => {
        const over = isActivityOverdue(a);
        const status = a.status || 'Pending';
        const cls = activityStatusClass(status);
        return `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <div>
              <span class="pill pill-${cls}">${escapeHtml(status)}</span>
              <span class="changelog-text">${escapeHtml(a.description)}</span>
            </div>
            <div class="cert-actions">
              ${status !== 'Complete' ? actionBtn('check', 'Complete', `markActivityComplete('${c.id}', '${a.id}')`, {cls: 'ok'}) : ''}
              ${actionBtn('edit', 'Edit', `openActivityModal('${c.id}', '${a.id}')`)}
              ${actionBtn('trash', 'Delete', `deleteActivity('${c.id}', '${a.id}')`, {cls: 'danger'})}
            </div>
          </div>
          <div class="activity-meta">
            Entered ${fmtDate(a.dateCreated)}${a.timeCreated ? ', ' + a.timeCreated : ''}
            ${a.dateDue ? ` \u00b7 Due ${fmtDate(a.dateDue)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}` : ''}
            ${a.dateUpdated && a.dateUpdated !== a.dateCreated ? ` \u00b7 Updated ${fmtDate(a.dateUpdated)}${a.timeUpdated ? ', ' + a.timeUpdated : ''}` : ''}
            ${a.dateCompleted ? ` \u00b7 Completed ${fmtDate(a.dateCompleted)}${a.timeCompleted ? ', ' + a.timeCompleted : ''}${lateNote(a)}` : ''}
          </div>
        </div>
      `; }).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No activities yet</span></div>'}
    </div>
  `;
}

async function saveActivityEntry(){
  const description = document.getElementById('a-description').value.trim();
  if(!description){
    document.getElementById('activity-err').style.display = 'block';
    return;
  }
  const certId = document.getElementById('activity-cert-id').value;
  const activityId = document.getElementById('activity-edit-id').value;
  const today = new Date().toISOString().slice(0,10);
  const nowT = nowTime();
  const status = document.getElementById('a-status').value || 'Pending';
  const dateDueRaw = document.getElementById('a-due').value;
  const dateDue = /^\d{4}-\d{2}-\d{2}$/.test(dateDueRaw) ? dateDueRaw : '';

  const c = certs.find(x => x.id === certId);
  if(!c) return;
  if(!Array.isArray(c.activityLog)) c.activityLog = [];

  if(activityId){
    const idx = c.activityLog.findIndex(x => x.id === activityId);
    if(idx > -1){
      const prevEntry = c.activityLog[idx];
      let dateCompleted = prevEntry.dateCompleted || '';
      let timeCompleted = prevEntry.timeCompleted || '';
      if(status === 'Complete' && !dateCompleted){ dateCompleted = today; timeCompleted = nowT; }
      if(status !== 'Complete'){ dateCompleted = ''; timeCompleted = ''; }
      c.activityLog[idx] = {
        ...prevEntry,
        description, status, dateDue,
        dateUpdated: today,
        timeUpdated: nowT,
        dateCompleted,
        timeCompleted
      };
    }
  }else{
    c.activityLog.push({
      id: 'a' + Date.now(),
      description, status, dateDue,
      dateCreated: today,
      timeCreated: nowT,
      dateUpdated: today,
      timeUpdated: nowT,
      dateCompleted: status === 'Complete' ? today : '',
      timeCompleted: status === 'Complete' ? nowT : ''
    });
  }
  await persist();
  closeActivityModal();
  render();
}

async function markActivityComplete(certId, activityId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.activityLog)) return;
  const a = c.activityLog.find(x => x.id === activityId);
  if(!a) return;
  const today = new Date().toISOString().slice(0,10);
  const nowT = nowTime();
  a.status = 'Complete';
  a.dateUpdated = today;
  a.timeUpdated = nowT;
  a.dateCompleted = today;
  a.timeCompleted = nowT;
  await persist();
  render();
}

async function deleteActivity(certId, activityId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.activityLog)) return;
  c.activityLog = c.activityLog.filter(a => a.id !== activityId);
  await persist();
  render();
}

async function saveChangeLogEntry(){
  const text = document.getElementById('l-text').value.trim();
  const date = document.getElementById('l-date').value;
  const err = document.getElementById('changelog-err');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.textContent = 'Enter a date.'; err.style.display = 'block'; return; }
  if(!text){ err.textContent = 'Enter the change log text.'; err.style.display = 'block'; return; }
  const c = certs.find(x => x.id === document.getElementById('changelog-cert-id').value);
  if(!c) return;
  if(!Array.isArray(c.docChangeLog)) c.docChangeLog = [];
  const entryId = document.getElementById('changelog-edit-id').value;
  if(entryId){
    const e = c.docChangeLog.find(x => x.id === entryId);
    if(e){
      // A recorded time only makes sense for the original date
      if(e.date !== date){ delete e.time; }
      e.date = date;
      e.text = text;
    }
  }else{
    c.docChangeLog.push({id: newLogId(), date, ts: Date.now(), text});
  }
  await persist();
  closeChangeLogModal();
  render();
}

async function deleteChangeLogEntry(certId, entryId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.docChangeLog)) return;
  const e = c.docChangeLog.find(x => x.id === entryId);
  if(!e) return;
  c.docChangeLog = c.docChangeLog.filter(x => x.id !== entryId);
  await persist();
  render();
}

async function saveDocumentEntry(){
  const name = document.getElementById('d-name').value.trim();
  if(!name){
    document.getElementById('document-err').style.display = 'block';
    return;
  }
  const certId = document.getElementById('document-cert-id').value;
  const docId = document.getElementById('document-edit-id').value;
  const url = document.getElementById('d-url').value.trim();
  const location = document.getElementById('d-location').value.trim();
  const today = new Date().toISOString().slice(0,10);

  const c = certs.find(x => x.id === certId);
  if(!c) return;
  if(!Array.isArray(c.docs)) c.docs = [];
  if(!Array.isArray(c.docChangeLog)) c.docChangeLog = [];

  if(docId){
    const idx = c.docs.findIndex(x => x.id === docId);
    if(idx > -1){
      c.docs[idx] = {...c.docs[idx], name, url};
      c.docChangeLog.push({id: newLogId(), date: today, time: nowTime(), ts: Date.now(), text: 'Document updated: ' + name});
    }
  }else{
    c.docs.push({id: 'd' + Date.now(), name, url});
    c.docChangeLog.push({id: newLogId(), date: today, time: nowTime(), ts: Date.now(), text: 'Document added: ' + name});
  }
  if(location !== (c.docLocation || '')){
    c.docChangeLog.push({id: newLogId(), date: today, time: nowTime(), ts: Date.now(), text: 'Document location updated: ' + (location || '(cleared)')});
    c.docLocation = location;
  }
  await persist();
  closeDocumentModal();
  render();
}

async function deleteDocument(certId, docId){
  const c = certs.find(x => x.id === certId);
  if(!c || !Array.isArray(c.docs)) return;
  const d = c.docs.find(x => x.id === docId);
  c.docs = c.docs.filter(x => x.id !== docId);
  if(!Array.isArray(c.docChangeLog)) c.docChangeLog = [];
  if(d) c.docChangeLog.push({id: newLogId(), date: new Date().toISOString().slice(0,10), time: nowTime(), ts: Date.now(), text: 'Document removed: ' + d.name});
  await persist();
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function renderDocLocation(loc){
  if(!loc) return '';
  const isUrl = /^https?:\/\//i.test(loc.trim());
  if(isUrl){
    return `<div class="doc-loc"><a href="${escapeHtml(loc.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(loc.trim())}</a></div>`;
  }
  return `<div class="doc-loc">${escapeHtml(loc)}</div>`;
}

function renderDocItem(doc){
  const name = typeof doc === 'string' ? doc : (doc.name || '');
  const url = typeof doc === 'string' ? '' : (doc.url || '');
  if(url){
    return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(name)} \u2193</a>`;
  }
  return escapeHtml(name);
}

async function saveCert(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){
    document.getElementById('err-name').style.display = 'block';
    return;
  }
  const id = document.getElementById('edit-id').value;
  const data = {
    name,
    customer: document.getElementById('f-customer').value.trim(),
    authority: document.getElementById('f-authority').value.trim(),
    country: document.getElementById('f-country').value.trim(),
    simLocation: document.getElementById('f-simlocation').value.trim(),
    serial: document.getElementById('f-serial').value.trim(),
    aircraft: document.getElementById('f-aircraft').value.trim(),
    level: document.getElementById('f-level').value.trim(),
    date: document.getElementById('f-date').value,
    primaryContact: document.getElementById('f-contact').value.trim()
  };

  if(id){
    const idx = certs.findIndex(c => c.id === id);
    if(idx > -1){
      const prev = certs[idx];
      certs[idx] = {...prev, ...data};
      if(!Array.isArray(certs[idx].activityLog)) certs[idx].activityLog = [];
      if(!Array.isArray(certs[idx].docChangeLog)) certs[idx].docChangeLog = [];
      if(!Array.isArray(certs[idx].docs)) certs[idx].docs = [];
    }
  }else{
    const newId = 'c' + Date.now();
    activeCertId = newId;
    certs.push({id: newId, ...data, docs: [], docLocation: '', activityLog: [], docChangeLog: []});
  }
  expandedCustomers.add(customerKey(data));
  await persist();
  closeModal();
  render();
}

async function removeCert(id){
  certs = certs.filter(c => c.id !== id);
  await persist();
  render();
}

document.getElementById('document-save-btn').addEventListener('click', saveDocumentEntry);
document.getElementById('document-modal-bg').addEventListener('click', (e) => {
  if(e.target.id === 'document-modal-bg') closeDocumentModal();
});

load();
</script>
