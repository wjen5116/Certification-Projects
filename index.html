<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification Project Tracker</title>
<link rel="stylesheet" href="assets/tracker.css?v=2.5.0">
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="brand">
      <h1><a class="brand-link" href="#" onclick="goHome(); return false;">Certification Project Tracker</a></h1>
      <p class="sub">View only</p>
    </div>
    <div class="head-tools">
      <div class="search-wrap" role="search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="Search customers, SNs, activities, regulations" aria-label="Search the tracker" autocomplete="off" aria-controls="search-suggest" aria-expanded="false">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <div class="search-suggest" id="search-suggest" role="listbox" aria-label="Your frequent searches" hidden></div>
      </div>
      <span id="summary-tools"></span>
      <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>

  <div class="summary-area">
    <div class="summary" id="summary" aria-label="Summary"></div>
    <div class="summary-note" id="summary-note"></div>
  </div>

  <div id="sync-banner" class="sync-banner" style="display:none;"></div>

  <div id="list"><div class="loading">Loading&hellip;</div></div>
  <div class="version-footer"><a href="changelog.html" title="Change log">v2.5.0</a></div>
</div>

<div class="modal-bg" id="settings-modal-bg">
  <div class="modal">
    <h3>Sign in to edit</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-top:-8px;">Enter a GitHub token with write access to open the editor. Your token is kept only in this browser's local storage — never written into the page or committed to the repo.</p>
    <div class="field">
      <label for="s-owner">Repo owner (user or org)</label>
      <input id="s-owner" placeholder="e.g. octocat">
    </div>
    <div class="field">
      <label for="s-repo">Repository name</label>
      <input id="s-repo" placeholder="e.g. certification-tracker">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="s-branch">Branch</label>
        <input id="s-branch" placeholder="main">
      </div>
      <div class="field">
        <label for="s-path">File path</label>
        <input id="s-path" placeholder="data/certifications.json">
      </div>
    </div>
    <div class="field">
      <label for="s-token">Personal access token (repo write scope)</label>
      <input id="s-token" type="password" placeholder="ghp_...">
    </div>
    <div class="err" id="settings-err" style="display:none;"></div>
    <div class="modal-actions">
      <button id="settings-cancel-btn">Cancel</button>
      <button class="btn-primary" id="settings-save-btn">Connect &amp; open editor</button>
    </div>
  </div>
</div>

<script src="assets/tracker.js?v=2.5.0"></script>
<script>
// View-only page: read-only connection and sign-in to the editor. Shared code is in assets/tracker.js.

// Hardcoded, read-only connection to the public data repo.
const ghConfig = {
  owner: 'wjen5116',
  repo: 'Certification-Projects',
  branch: 'main',
  path: 'data/certifications.json',
  token: ''
};

// ---- Sign-in to the editor (admin/project-management.html) ----

function saveSettings(cfg){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
}

function showSettingsError(msg){
  const el = document.getElementById('settings-err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function openSettings(message){
  const cfg = loadSettings() || {};
  document.getElementById('s-owner').value = cfg.owner || ghConfig.owner;
  document.getElementById('s-repo').value = cfg.repo || ghConfig.repo;
  document.getElementById('s-branch').value = cfg.branch || ghConfig.branch;
  document.getElementById('s-path').value = cfg.path || ghConfig.path;
  document.getElementById('s-token').value = cfg.token || '';
  showSettingsError(message || '');
  document.getElementById('settings-modal-bg').classList.add('open');
  document.getElementById('s-token').focus();
}

function closeSettings(){
  document.getElementById('settings-modal-bg').classList.remove('open');
}

// Confirms the token can reach the repo and write to it. Returns an error message, or '' if OK.
async function verifyCredentials(cfg){
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Authorization': 'Bearer ' + cfg.token
  };
  let res;
  try{
    res = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, {headers});
  }catch(e){
    return 'Could not reach GitHub. Check your connection and try again.';
  }
  if(res.status === 401) return 'GitHub rejected this token. Check it has not expired or been revoked.';
  if(res.status === 403) return 'GitHub refused access with this token (403). It may be rate-limited or blocked by organisation policy.';
  if(res.status === 404) return `Repo ${cfg.owner}/${cfg.repo} was not found, or this token cannot access it.`;
  if(!res.ok) return `GitHub check failed (${res.status}).`;
  const repo = await res.json();
  if(repo.permissions && repo.permissions.push === false){
    return 'This token can read the repo but does not have write access. Use a token with Contents: read and write.';
  }
  return '';
}

document.getElementById('settings-btn').addEventListener('click', () => openSettings());

document.getElementById('settings-cancel-btn').addEventListener('click', closeSettings);

document.getElementById('settings-modal-bg').addEventListener('click', (e) => {
  if(e.target.id === 'settings-modal-bg') closeSettings();
});

document.getElementById('settings-save-btn').addEventListener('click', async () => {
  const owner = document.getElementById('s-owner').value.trim();
  const repo = document.getElementById('s-repo').value.trim();
  const branch = document.getElementById('s-branch').value.trim() || 'main';
  const path = document.getElementById('s-path').value.trim() || FILE_PATH_DEFAULT;
  const token = document.getElementById('s-token').value.trim();
  if(!owner || !repo || !token){
    showSettingsError('Owner, repo, and token are required.');
    return;
  }
  const btn = document.getElementById('settings-save-btn');
  btn.disabled = true;
  btn.textContent = 'Checking\u2026';
  showSettingsError('');
  const cfg = {owner, repo, branch, path, token};
  const problem = await verifyCredentials(cfg);
  btn.disabled = false;
  btn.textContent = 'Connect & open editor';
  if(problem){
    showSettingsError(problem);
    return;
  }
  saveSettings(cfg);
  location.href = 'admin/project-management.html' + location.hash;
});

// Arriving from the editor (no credentials, or the saved token was rejected)
(function(){
  const params = new URLSearchParams(location.search);
  if(params.get('settings') === '1'){
    openSettings(params.get('reason') === 'rejected'
      ? 'GitHub rejected the saved token. Enter a valid token to open the editor.'
      : '');
    history.replaceState(null, '', location.pathname);
  }
})();

async function load(){
  try{
    showBanner('info', 'Loading from GitHub&hellip;');
    const remote = await fetchFromGitHub();
    if(remote === null){
      certs = [];
      showBanner('error', 'No data file found at that path yet.');
    }else{
      certs = remote;
      hideBanner();
    }
  }catch(e){
    showBanner('error', 'Could not load from GitHub: ' + escapeHtml(e.message));
    certs = [];
  }
  render();
  loadLibrary();
}

// ---- Keeping the page up to date ----
// Check GitHub again when this tab is selected (at most every 5 seconds).
async function refreshFromGitHub(){
  if(Date.now() - lastFetchAt < 5000) return;
  const prevSha = currentSha;
  try{
    const remote = await fetchFromGitHub();
    if(remote && currentSha !== prevSha){
      certs = remote;
      hideBanner();
      render();
    }
  }catch(e){ /* keep showing what's already loaded */ }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') refreshFromGitHub();
});

window.addEventListener('focus', refreshFromGitHub);

// When the editor saves in another tab of this browser, show the new data straight away.
const SYNC_KEY = `${ghConfig.owner}/${ghConfig.repo}@${ghConfig.branch}:${ghConfig.path}`.toLowerCase();

if('BroadcastChannel' in window){
  const syncChannel = new BroadcastChannel('cert-tracker-sync');
  syncChannel.onmessage = (e) => {
    const m = e.data || {};
    if(m.type === 'saved' && m.key === SYNC_KEY && Array.isArray(m.data)){
      certs = m.data;
      if(m.library) library = normalizeLibrary(m.library);
      currentSha = m.sha || currentSha;
      hideBanner();
      render();
    }
  };
}

initHeader();
load();
</script>
</body>
</html>
