<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certification Project Tracker (View Only)</title>
<style>
  :root{
    --bg:#000000;
    --card:#121212;
    --line:#333333;
    --ink:#FFFFFF;
    --ink-soft:#CCCCCC;
    --ink-faint:#999999;
    --pine:#8FCDB5;
    --pine-bg:#1F3B32;
    --gold:#E7C07E;
    --gold-bg:#3D2F14;
    --rust:#EC9B92;
    --rust-bg:#3D1F1B;
    --sage:#B3D2AA;
    --sage-bg:#233B22;
    --slate:#B3C4DA;
    --slate-bg:#25303D;
    --radius:10px;
    --serif: Calibri, "Segoe UI", Georgia, serif;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px) 60px;
  }
  .wrap{max-width:min(1200px, 96vw);margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:31px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{color:var(--ink-soft);font-size:16px;margin:0;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin:22px 0 26px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1;}
  .stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
  }
  .toolbar h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 14px;
    color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint);}
  .btn-primary{
    background:var(--pine);
    border-color:var(--pine);
    color:#0A1F19;
  }
  .btn-primary:hover{background:#7AB89E;}
  .btn-text{
    border:none;
    background:none;
    padding:4px 6px;
    color:var(--ink-soft);
    text-decoration:underline;
  }
  .btn-text.danger{color:var(--rust);}

  .empty{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty p{margin:0 0 14px;font-size:16px;}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:14px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:#1A1A1A;
    overflow-wrap:break-word;
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#1A1A1A;}
  .cert-name{font-weight:500;font-family:var(--serif);font-size:16px;}
  .muted{color:var(--ink-soft);}
  .pill{
    font-size:12px;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
    font-weight:600;
    display:inline-block;
  }
  .pill-notstarted{background:#2A2A2A;color:var(--ink-soft);}
  .pill-inprogress{background:var(--pine-bg);color:var(--pine);}
  .pill-submitted{background:var(--slate-bg);color:var(--slate);}
  .pill-underreview{background:var(--gold-bg);color:var(--gold);}
  .pill-approved{background:var(--sage-bg);color:var(--sage);}
  .pill-rejected{background:var(--rust-bg);color:var(--rust);}
  .pill-onhold{background:#2A2A2A;color:var(--ink-soft);}
  .pill-overdue{background:var(--rust-bg);color:var(--rust);}
  .pill-slate{background:var(--slate-bg);color:var(--slate);margin-right:6px;}
  .pill-gold{background:var(--gold-bg);color:var(--gold);margin-right:6px;}
  .pill-sage{background:var(--sage-bg);color:var(--sage);margin-right:6px;}
  .due-cell.overdue{color:var(--rust);font-weight:600;}
  .actions-cell{white-space:nowrap;}
  .change-cell{max-width:220px;}
  .doc-loc{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
    word-break:break-all;
    user-select:all;
  }
  .doc-loc a{color:var(--pine);text-decoration:underline;}
  .field-grid .fv a{color:var(--pine);text-decoration:underline;}

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    border-bottom:1px solid var(--line);
    padding-bottom:0;
    margin-bottom:16px;
  }
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid transparent;
    border-bottom:none;
    border-radius:8px 8px 0 0;
    background:none;
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:15px;
    cursor:pointer;
  }
  .tab:hover{color:var(--ink);background:#1A1A1A;}
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--line);
    font-weight:500;
  }
  .tab.active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:var(--card);
  }
  .tab-count{
    font-size:12px;
    background:var(--slate-bg);
    color:var(--slate);
    padding:1px 7px;
    border-radius:99px;
    font-weight:600;
  }
  .tab-overdue-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--rust);
    display:inline-block;
  }
  .tab-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:6px 16px 14px;
  }
  .cgroup-add{padding-top:6px;}
  .cert-block{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cert-block:last-child{border-bottom:none;}
  .cert-block-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .cert-collapse-toggle{
    width:100%;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    color:var(--ink);
  }
  .cert-collapse-toggle:hover .cert-name{color:var(--pine);}
  .cert-collapse-toggle .chevron{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    margin-right:6px;
    transition:transform 0.15s ease;
  }
  .cert-collapse-toggle .chevron.open{transform:rotate(90deg);}
  .serial-heading{
    font-family:var(--serif);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:16px 0 4px;
  }
  .serial-heading:first-child{margin-top:0;}
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px 20px;
    margin-top:10px;
    font-size:14px;
  }
  .field-grid .fk{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .field-grid .fv{color:var(--ink);}
  .field-grid .full{grid-column:1 / -1;}
  .inline-edit-row{margin-top:2px;}
  .inline-input{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .inline-input:focus{border-color:var(--pine);outline:none;}
  .changelog{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .changelog-entry{
    display:flex;
    gap:10px;
    font-size:13px;
    padding:3px 0;
  }
  .changelog-date{
    color:var(--ink-faint);
    min-width:80px;
    flex-shrink:0;
  }
  .changelog-text{color:var(--ink-soft);}
  .activity-entry{
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .activity-entry:last-child{border-bottom:none;}
  .activity-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .activity-meta{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,36,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    max-width:min(520px, 92vw);
    width:100%;
  }
  .modal h3{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:16px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .err{color:var(--rust);font-size:13px;margin-top:4px;display:none;}
  .loading{color:var(--ink-soft);font-size:14px;padding:20px 0;}

  @media (max-width: 640px){
    .field-grid{grid-template-columns:1fr;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;}
    .tab{flex-shrink:0;}
  }
  .sync-banner{
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .sync-banner.info{background:var(--slate-bg);color:var(--slate);border-color:var(--slate);}
  .sync-banner.error{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}
  .sync-banner.success{background:var(--sage-bg);color:var(--sage);border-color:var(--sage);}
  .sync-banner a{color:inherit;text-decoration:underline;}
  .version-footer{
    margin-top:24px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--ink-faint);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Certification Project Tracker</h1>
    <p class="sub">View only — Certification Projects</p>
  </header>

  <div class="stats" id="stats"></div>

  <div id="sync-banner" class="sync-banner" style="display:none;"></div>

  <div class="toolbar">
    <h2>Certifications</h2>
  </div>

  <div id="list"><div class="loading">Loading&hellip;</div></div>
  <div class="version-footer">v2.1.1</div>
</div>

<script>
let certs = [];
let activeCustomer = null;
let expandedCertIds = new Set();
let currentSha = null;

// Hardcoded, read-only connection to the public data repo.
const ghConfig = {
  owner: 'wjen5116',
  repo: 'Certification-Projects',
  branch: 'main',
  path: 'data/certifications.json',
  token: ''
};

function showBanner(kind, html){
  const el = document.getElementById('sync-banner');
  el.className = 'sync-banner ' + kind;
  el.innerHTML = html;
  el.style.display = 'block';
}

function hideBanner(){
  document.getElementById('sync-banner').style.display = 'none';
}

// UTF-8 safe base64 encode/decode
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

function ghHeaders(){
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if(ghConfig.token) headers['Authorization'] = 'Bearer ' + ghConfig.token;
  return headers;
}

function ghUrl(){
  return `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${encodeURIComponent(ghConfig.path).replace(/%2F/g,'/')}`;
}

async function fetchFromGitHub(){
  const res = await fetch(ghUrl() + `?ref=${encodeURIComponent(ghConfig.branch)}`, {
    headers: ghHeaders()
  });
  if(res.status === 404){
    return null; // file doesn't exist yet
  }
  if(!res.ok){
    const body = await res.text();
    throw new Error(`GitHub read failed (${res.status}): ${body.slice(0,200)}`);
  }
  const json = await res.json();
  currentSha = json.sha;
  const content = b64DecodeUtf8(json.content.replace(/\n/g,''));
  return JSON.parse(content);
}

async function load(){
  try{
    showBanner('info', 'Loading from GitHub&hellip;');
    const remote = await fetchFromGitHub();
    if(remote === null){
      certs = [];
      showBanner('error', 'No data file found at that path yet.');
    }else{
      certs = remote;
      hideBanner();
    }
  }catch(e){
    showBanner('error', 'Could not load from GitHub: ' + escapeHtml(e.message));
    certs = [];
  }
  render();
}

function statusPillClass(){ return ''; }

function isOverdue(c){
  if(!c.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.date + 'T00:00:00');
  return d < today;
}

function fmtDate(d){
  if(!d) return '\u2014';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

function render(){
  const stats = document.getElementById('stats');
  const total = certs.length;
  const overdue = certs.filter(isOverdue).length;
  const dueSoon = certs.filter(c => {
    if(!c.date || isOverdue(c)) return false;
    const d = new Date(c.date + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;
  const noDate = certs.filter(c => !c.date).length;

  stats.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="n">${dueSoon}</div><div class="l">Due in 30 days</div></div>
    <div class="stat"><div class="n">${noDate}</div><div class="l">No due date</div></div>
  `;

  const list = document.getElementById('list');
  if(certs.length === 0){
    list.innerHTML = `<div class="empty"><p>No certifications found.</p></div>`;
    return;
  }

  const groups = {};
  const order = [];
  certs.forEach(c => {
    const key = (c.customer || 'Unassigned').trim() || 'Unassigned';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });

  const CUSTOMER_ORDER = ['skyborne airline academy', 'skyborn airline academy', 'us aviation academy', 'aeroguard', 'superior air'];
  order.sort((a,b) => {
    const ai = CUSTOMER_ORDER.indexOf(a.trim().toLowerCase());
    const bi = CUSTOMER_ORDER.indexOf(b.trim().toLowerCase());
    const aRank = ai === -1 ? CUSTOMER_ORDER.length : ai;
    const bRank = bi === -1 ? CUSTOMER_ORDER.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.localeCompare(b);
  });

  if(!activeCustomer || !order.includes(activeCustomer)){
    activeCustomer = order[0];
  }

  const tabBar = order.map(customer => {
    const items = groups[customer];
    const anyOverdue = items.some(isOverdue);
    const isActive = customer === activeCustomer;
    return `
      <button class="tab ${isActive ? 'active' : ''}" onclick="selectCustomer('${escapeAttr(customer)}')">
        ${escapeHtml(customer)}
        <span class="tab-count">${items.length}</span>
        ${anyOverdue ? '<span class="tab-overdue-dot" aria-hidden="true"></span>' : ''}
      </button>
    `;
  }).join('');

  const activeItems = sortCerts(groups[activeCustomer] || []);
  const { groups: serialGroups, order: serialOrder } = groupBySerial(activeItems);
  const showSerialHeaders = serialOrder.length > 1;

  list.innerHTML = `
    <div class="tabs" role="tablist">${tabBar}</div>
    <div class="tab-panel">
      ${serialOrder.map(serialKey => `
        ${showSerialHeaders ? `<div class="serial-heading">${escapeHtml(serialKey)}</div>` : ''}
        ${serialGroups[serialKey].map(c => {
        const over = isOverdue(c);
        const expanded = expandedCertIds.has(c.id);
        const status = computeCertStatus(c);
        return `
        <div class="cert-block">
          <button class="cert-block-top cert-collapse-toggle" onclick="toggleCertExpand('${c.id}')">
            <span class="cert-name">
              <span class="chevron ${expanded ? 'open' : ''}" aria-hidden="true">&#9656;</span>
              ${escapeHtml(c.name)}
            </span>
            <span class="pill pill-${status.cls}">${status.label}</span>
          </button>
          ${expanded ? `
          <div class="field-grid">
            <div>
              <div class="fk">SIM location</div>
              <div class="fv">${escapeHtml(c.simLocation || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Certifying country</div>
              <div class="fv">${escapeHtml(c.country || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Regulatory authority</div>
              <div class="fv">${escapeHtml(c.authority || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">SIM serial number</div>
              <div class="fv">${escapeHtml(c.serial || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Aircraft type</div>
              <div class="fv">${escapeHtml(c.aircraft || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Certification level</div>
              <div class="fv">${escapeHtml(c.level || '\u2014')}</div>
            </div>
            <div>
              <div class="fk">Due date</div>
              <div class="fv ${over ? 'due-cell overdue' : ''}">${fmtDate(c.date)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}</div>
            </div>
            <div>
              <div class="fk">Primary contact</div>
              <div class="fv">${escapeHtml(c.primaryContact || '\u2014')}</div>
            </div>
          </div>
          ${renderDocumentsSection(c)}
          ${renderDocChangeLog(c)}
          ${renderActivityLog(c)}
          ` : ''}
        </div>
      `; }).join('')}
      `).join('')}
    </div>
  `;
}

function isCertOverdue(c){
  if(isOverdue(c)) return true;
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  return acts.some(isActivityOverdue);
}

function computeCertStatus(c){
  if(isCertOverdue(c)) return {label: 'Overdue', cls: 'overdue'};
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  if(acts.length === 0) return {label: 'No Activity', cls: 'slate'};
  const anyOpen = acts.some(a => a.status !== 'Complete');
  if(anyOpen) return {label: 'In Progress', cls: 'gold'};
  return {label: 'On Track', cls: 'sage'};
}

function sortCerts(items){
  return [...items].sort((a,b) => {
    const aOver = isCertOverdue(a) ? 0 : 1;
    const bOver = isCertOverdue(b) ? 0 : 1;
    if(aOver !== bOver) return aOver - bOver;
    const ad = a.date || '9999-99-99';
    const bd = b.date || '9999-99-99';
    return ad.localeCompare(bd);
  });
}

function groupBySerial(items){
  const groups = {};
  const order = [];
  items.forEach(c => {
    const key = c.serial || 'No serial number';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });
  return { groups, order };
}

function toggleCertExpand(id){
  if(expandedCertIds.has(id)) expandedCertIds.delete(id);
  else expandedCertIds.add(id);
  render();
}

function selectCustomer(name){
  activeCustomer = name;
  render();
}

function escapeAttr(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function renderDocumentsSection(c){
  const docs = Array.isArray(c.docs) ? c.docs : [];
  return `
    <div class="changelog">
      <div class="fk">Documents</div>
      ${docs.length ? docs.map(d => `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <span class="changelog-text">${renderDocItem(d)}</span>
          </div>
        </div>
      `).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No documents yet</span></div>'}
      ${c.docLocation ? `<div class="activity-entry-top" style="margin-top:6px;">${renderDocLocation(c.docLocation)}</div>` : ''}
    </div>
  `;
}

function renderDocChangeLog(c){
  const entries = Array.isArray(c.docChangeLog) ? c.docChangeLog : [];
  const sorted = [...entries].sort((a,b) => (b.ts || 0) - (a.ts || 0) || (b.date||'').localeCompare(a.date||''));
  return `
    <div class="changelog">
      <div class="fk">Document Change Log</div>
      ${sorted.length ? sorted.map(entry => `
        <div class="changelog-entry">
          <span class="changelog-date">${fmtDate(entry.date)}${entry.time ? ', ' + entry.time : ''}</span>
          <span class="changelog-text">${escapeHtml(entry.text)}</span>
        </div>
      `).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No entries yet</span></div>'}
    </div>
  `;
}

function isActivityOverdue(a){
  if(!a.dateDue) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(a.dateDue + 'T00:00:00') < today;
}

function activityStatusClass(status){
  if(status === 'Complete') return 'sage';
  if(status === 'In Progress') return 'gold';
  return 'slate';
}

function renderActivityLog(c){
  const entries = Array.isArray(c.activityLog) ? c.activityLog : [];
  const sorted = [...entries].sort((a,b) => {
    const aDone = a.status === 'Complete' ? 1 : 0;
    const bDone = b.status === 'Complete' ? 1 : 0;
    if(aDone !== bDone) return aDone - bDone;
    const ad = a.dateDue || a.dateCreated || '';
    const bd = b.dateDue || b.dateCreated || '';
    return aDone === 0 ? ad.localeCompare(bd) : bd.localeCompare(ad);
  });
  return `
    <div class="changelog">
      <div class="fk">Activities</div>
      ${sorted.length ? sorted.map(a => {
        const over = isActivityOverdue(a);
        const status = a.status || 'Pending';
        const cls = activityStatusClass(status);
        return `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <div>
              <span class="pill pill-${cls}">${escapeHtml(status)}</span>
              <span class="changelog-text">${escapeHtml(a.description || a.text || '')}</span>
            </div>
          </div>
          <div class="activity-meta">
            Entered ${fmtDate(a.dateCreated)}${a.timeCreated ? ', ' + a.timeCreated : ''}
            ${a.dateDue ? ` \u00b7 Due ${fmtDate(a.dateDue)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}` : ''}
            ${a.dateUpdated && a.dateUpdated !== a.dateCreated ? ` \u00b7 Updated ${fmtDate(a.dateUpdated)}${a.timeUpdated ? ', ' + a.timeUpdated : ''}` : ''}
            ${a.dateCompleted ? ` \u00b7 Completed ${fmtDate(a.dateCompleted)}${a.timeCompleted ? ', ' + a.timeCompleted : ''}` : ''}
          </div>
        </div>
      `; }).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No activities yet</span></div>'}
    </div>
  `;
}


function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function renderDocLocation(loc){
  if(!loc) return '';
  const isUrl = /^https?:\/\//i.test(loc.trim());
  if(isUrl){
    return `<div class="doc-loc"><a href="${escapeHtml(loc.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(loc.trim())}</a></div>`;
  }
  return `<div class="doc-loc">${escapeHtml(loc)}</div>`;
}

function renderDocItem(doc){
  const name = typeof doc === 'string' ? doc : (doc.name || '');
  const url = typeof doc === 'string' ? '' : (doc.url || '');
  if(url){
    return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(name)} \u2193</a>`;
  }
  return escapeHtml(name);
}

load();
</script>
</body>
</html>
