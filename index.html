<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Certification Tracker</title>
<style>
  :root{
    --bg:#000000;
    --card:#121212;
    --line:#333333;
    --ink:#FFFFFF;
    --ink-soft:#CCCCCC;
    --ink-faint:#999999;
    --pine:#8FCDB5;
    --pine-bg:#1F3B32;
    --gold:#E7C07E;
    --gold-bg:#3D2F14;
    --rust:#EC9B92;
    --rust-bg:#3D1F1B;
    --sage:#B3D2AA;
    --sage-bg:#233B22;
    --slate:#B3C4DA;
    --slate-bg:#25303D;
    --radius:10px;
    --serif: Calibri, "Segoe UI", Georgia, serif;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px) 60px;
  }
  .wrap{max-width:min(1200px, 96vw);margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin:22px 0 26px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .n{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1;}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
  }
  .toolbar h2{
    font-family:var(--serif);
    font-size:17px;
    font-weight:500;
    margin:0;
  }
  button{
    font-family:var(--sans);
    font-size:13px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 14px;
    color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint);}
  .btn-primary{
    background:var(--pine);
    border-color:var(--pine);
    color:#0A1F19;
  }
  .btn-primary:hover{background:#7AB89E;}
  .btn-text{
    border:none;
    background:none;
    padding:4px 6px;
    color:var(--ink-soft);
    text-decoration:underline;
  }
  .btn-text.danger{color:var(--rust);}

  .empty{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty p{margin:0 0 14px;font-size:14px;}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:#1A1A1A;
    overflow-wrap:break-word;
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#1A1A1A;}
  .cert-name{font-weight:500;font-family:var(--serif);font-size:14.5px;}
  .muted{color:var(--ink-soft);}
  .pill{
    font-size:11px;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
    font-weight:600;
    display:inline-block;
  }
  .pill-notstarted{background:#2A2A2A;color:var(--ink-soft);}
  .pill-inprogress{background:var(--pine-bg);color:var(--pine);}
  .pill-submitted{background:var(--slate-bg);color:var(--slate);}
  .pill-underreview{background:var(--gold-bg);color:var(--gold);}
  .pill-approved{background:var(--sage-bg);color:var(--sage);}
  .pill-rejected{background:var(--rust-bg);color:var(--rust);}
  .pill-onhold{background:#2A2A2A;color:var(--ink-soft);}
  .pill-overdue{background:var(--rust-bg);color:var(--rust);}
  .due-cell.overdue{color:var(--rust);font-weight:600;}
  .actions-cell{white-space:nowrap;}
  .change-cell{max-width:220px;}
  .doc-loc{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:4px;
    word-break:break-all;
    user-select:all;
  }

  .cgroup{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .cgroup-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
  }
  .cgroup-header:hover{background:#1A1A1A;}
  .cgroup-title{
    font-family:var(--serif);
    font-size:16px;
    font-weight:500;
  }
  .cgroup-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .cgroup-right{display:flex;align-items:center;gap:10px;}
  .chevron{
    transition:transform 0.15s ease;
    color:var(--ink-faint);
    font-size:12px;
  }
  .cgroup.open .chevron{transform:rotate(90deg);}
  .cgroup-body{
    display:none;
    border-top:1px solid var(--line);
    padding:4px 16px 14px;
  }
  .cgroup.open .cgroup-body{display:block;}
  .cgroup-add{padding-top:6px;}
  .cert-block{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cert-block:last-child{border-bottom:none;}
  .cert-block-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px 20px;
    margin-top:10px;
    font-size:13px;
  }
  .field-grid .fk{
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .field-grid .fv{color:var(--ink);}
  .field-grid .full{grid-column:1 / -1;}
  .badge-count{
    font-size:11px;
    background:var(--slate-bg);
    color:var(--slate);
    padding:2px 8px;
    border-radius:99px;
    font-weight:600;
  }

  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,36,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    max-width:min(520px, 92vw);
    width:100%;
  }
  .modal h3{
    font-family:var(--serif);
    font-weight:500;
    font-size:18px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .err{color:var(--rust);font-size:12px;margin-top:4px;display:none;}
  .loading{color:var(--ink-soft);font-size:13px;padding:20px 0;}

  @media (max-width: 640px){
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

    docs: ['R-MCX-100251__PA28_Archer__UK_FNPTII_MQTG_v1_1.docx', 'Validation_Data_Roadmap__PA28_Archer_.docx'],

const CUSTOMER_CERT_SETS = {

};

function applyCertSets(){
  let changed = false;
  Object.keys(CUSTOMER_CERT_SETS).forEach(key => {
    const items = CUSTOMER_CERT_SETS[key];
    const haveAll = items.every(item => certs.some(c => c.id === item.id));
    if(!haveAll){
      const placeholderIdx = certs.findIndex(c =>
        (c.customer || '').trim().toLowerCase() === key &&
        / certification$/.test(c.name || '') &&
        !c.status && !c.change && !c.serial
      );
      if(placeholderIdx > -1) certs.splice(placeholderIdx, 1);
      items.forEach(item => {
        if(!certs.some(c => c.id === item.id)){
          const custName = DEFAULT_CUSTOMERS.find(n => n.toLowerCase() === key) || key;
          certs.push({
            id: item.id,
            name: item.name,
            customer: custName,
            authority: item.authority,
            status: item.status,
            date: '',
            change: item.change,
            docs: item.docs,
            docLocation: item.docLocation,
            serial: item.serial,
            aircraft: item.aircraft,
            country: item.country || '',
            simLocation: item.simLocation || '',
            level: item.level || '',
            _rev: 0,
            _setRev: item.rev || 0
          });
          changed = true;
        }
      });
    }
    items.forEach(item => {
      const existing = certs.find(c => c.id === item.id);
      if(!existing) return;
      if((existing._setRev || 0) < (item.rev || 0)){
        if(item.country !== undefined) existing.country = item.country || '';
        if(item.simLocation) existing.simLocation = item.simLocation;
        if(item.level) existing.level = item.level;
        if(item.docLocation) existing.docLocation = item.docLocation;
        if(item.authority) existing.authority = item.authority;
        if(item.serial) existing.serial = item.serial;
        if(item.change) existing.change = item.change;
        if(item.status) existing.status = item.status;
        existing._setRev = item.rev;
        changed = true;
      }
    });
  });
  return changed;
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    certs = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    certs = [];
  }
  if(certs.length === 0){
    certs = DEFAULT_CUSTOMERS.map((customer, i) => ({
      id: 'c' + Date.now() + i,
      name: customer + ' certification',
      customer,
      authority: AUTHORITY_MAP[customer.toLowerCase()] || '',
      status: '',
      date: '',
      change: '',
      docs: [],
      docLocation: '',
      serial: '',
      aircraft: '',
      country: '',
      simLocation: '',
      level: '',
      _rev: 0
    }));
    certs.forEach(c => {
      const key = (c.customer || '').trim().toLowerCase();
      const upd = RECORD_UPDATES[key];
      if(upd){
        if(upd.name) c.name = upd.name;
        if(upd.status) c.status = upd.status;
        if(upd.change) c.change = upd.change;
        if(upd.docs) c.docs = upd.docs;
        if(upd.docLocation) c.docLocation = upd.docLocation;
        if(upd.serial) c.serial = upd.serial;
        if(upd.aircraft) c.aircraft = upd.aircraft;
        if(upd.country !== undefined) c.country = upd.country || '';
        if(upd.simLocation) c.simLocation = upd.simLocation;
        if(upd.level) c.level = upd.level;
        c._rev = upd.rev;
      }
    });
    applyCertSets();
    await persist();
  }else{
    let changed = false;
    certs.forEach(c => {
      const key = (c.customer || '').trim().toLowerCase();
      if(!c.authority && AUTHORITY_MAP[key]){
        c.authority = AUTHORITY_MAP[key];
        changed = true;
      }
      const upd = RECORD_UPDATES[key];
      if(upd && (c._rev || 0) < upd.rev){
        if(upd.name) c.name = upd.name;
        if(upd.status) c.status = upd.status;
        if(upd.change) c.change = upd.change;
        if(upd.docs) c.docs = upd.docs;
        if(upd.docLocation) c.docLocation = upd.docLocation;
        if(upd.serial) c.serial = upd.serial;
        if(upd.aircraft) c.aircraft = upd.aircraft;
        if(upd.country !== undefined) c.country = upd.country || '';
        if(upd.simLocation) c.simLocation = upd.simLocation;
        if(upd.level) c.level = upd.level;
        c._rev = upd.rev;
        changed = true;
      }
      if(STATUS_LABELS[c.status]){
        c.status = STATUS_LABELS[c.status];
        changed = true;
      }
    });
    if(applyCertSets()) changed = true;
    if(changed) await persist();
  }
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(certs), false);
  }catch(e){
    console.error('Storage error', e);
  }
}

const STATUS_LABELS = {
  'not-started':'Not started',
  'in-progress':'In progress',
  'submitted':'Submitted',
  'under-review':'Under review',
  'approved':'Approved',
  'rejected':'Rejected',
  'on-hold':'On hold'
};

function isOverdue(c){
  if(!c.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.date + 'T00:00:00');
  return d < today;
}

function fmtDate(d){
  if(!d) return '\u2014';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

function render(){
  const stats = document.getElementById('stats');
  const total = certs.length;
  const overdue = certs.filter(isOverdue).length;
  const dueSoon = certs.filter(c => {
    if(!c.date || isOverdue(c)) return false;
    const d = new Date(c.date + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;
  const noDate = certs.filter(c => !c.date).length;

  stats.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="n">${dueSoon}</div><div class="l">Due in 30 days</div></div>
    <div class="stat"><div class="n">${noDate}</div><div class="l">No due date</div></div>
  `;

  const list = document.getElementById('list');
  if(certs.length === 0){
    list.innerHTML = `<div class="empty"><p>No certifications yet.</p></div>`;
    return;
  }

  const groups = {};
  const order = [];
  certs.forEach(c => {
    const key = (c.customer || 'Unassigned').trim() || 'Unassigned';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });

  const CUSTOMER_ORDER = ['skyborn airline academy', 'skyborne airline academy', 'us aviation academy', 'aeroguard', 'superior air'];
  order.sort((a,b) => {
    const ai = CUSTOMER_ORDER.indexOf(a.trim().toLowerCase());
    const bi = CUSTOMER_ORDER.indexOf(b.trim().toLowerCase());
    const aRank = ai === -1 ? CUSTOMER_ORDER.length : ai;
    const bRank = bi === -1 ? CUSTOMER_ORDER.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.localeCompare(b);
  });

  if(expandedCustomers.size === 0){
    order.forEach(k => expandedCustomers.add(k));
  }

  list.innerHTML = order.map(customer => {
    const items = groups[customer];
    const anyOverdue = items.some(isOverdue);
    const isOpen = expandedCustomers.has(customer);
    return `
      <div class="cgroup ${isOpen ? 'open' : ''}">
        <button class="cgroup-header" onclick="toggleCustomer('${escapeAttr(customer)}')">
          <div>
            <div class="cgroup-title">${escapeHtml(customer)}</div>
            <div class="cgroup-sub">${items.length} certification${items.length === 1 ? '' : 's'}${anyOverdue ? ' \u00b7 overdue' : ''}</div>
          </div>
          <div class="cgroup-right">
            <span class="badge-count">${items.length}</span>
            <span class="chevron" aria-hidden="true">&#9656;</span>
          </div>
        </button>
        <div class="cgroup-body">
          ${items.map(c => {
            const over = isOverdue(c);
            return `
            <div class="cert-block">
              <div class="cert-block-top">
                <span class="cert-name">${escapeHtml(c.name)}</span>
              </div>
              <div class="field-grid">
                <div>
                  <div class="fk">SIM location</div>
                  <div class="fv">${escapeHtml(c.simLocation || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">Certifying country</div>
                  <div class="fv">${escapeHtml(c.country || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">Regulatory authority</div>
                  <div class="fv">${escapeHtml(c.authority || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">SIM serial number</div>
                  <div class="fv">${escapeHtml(c.serial || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">Aircraft type</div>
                  <div class="fv">${escapeHtml(c.aircraft || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">Certification level</div>
                  <div class="fv">${escapeHtml(c.level || '\u2014')}</div>
                </div>
                <div>
                  <div class="fk">Due date</div>
                  <div class="fv ${over ? 'due-cell overdue' : ''}">${fmtDate(c.date)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}</div>
                </div>
                <div>
                  <div class="fk">Last action</div>
                  <div class="fv">${escapeHtml(c.status || '\u2014')}</div>
                </div>
                <div class="full">
                  <div class="fk">Next task</div>
                  <div class="fv">${escapeHtml(c.change || '\u2014')}</div>
                </div>
                <div class="full">
                  <div class="fk">Documents</div>
                  <div class="fv">${(c.docs && c.docs.length) ? c.docs.map(escapeHtml).join('<br>') : '\u2014'}${c.docLocation ? `<div class="doc-loc">${escapeHtml(c.docLocation)}</div>` : ''}</div>
                </div>
              </div>
            </div>
          `; }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleCustomer(name){
  if(expandedCustomers.has(name)) expandedCustomers.delete(name);
  else expandedCustomers.add(name);
  render();
}

function escapeAttr(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}


load();
</script>
</body>
</html>
