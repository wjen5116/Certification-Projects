<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification Project Tracker (View Only)</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#A70E13;
    --on-bg:#FFFFFF;
    --on-bg-soft:#F6D2D4;
    --on-bg-line:rgba(255,255,255,0.35);
    --card:#FFFFFF;
    --card-line:#4A545B;
    --line:#D8DCDF;
    --line-strong:#B4BBC0;
    --hover:#E1E5E8;
    --neutral-bg:#E6E9EB;
    --backdrop:rgba(20,24,27,0.45);
    --ink:#23292E;
    --ink-soft:#4A545B;
    --ink-faint:#6A747B;
    --accent:#A70E13;
    --accent-hover:#8C0B10;
    --accent-ink:#A70E13;
    --hover-ink:#A70E13;
    --accent-bg:#FBE8E9;
    --on-accent:#FFFFFF;
    --rust:#C2410C;
    --rust-bg:#FFEDD5;
    --rust-strong:#9A3409;
    --rust-bg-strong:#FFE0C2;
    --gold:#875A00;
    --gold-bg:#FCEFD3;
    --sage:#2E6A2A;
    --sage-bg:#E2F0DE;
    --sage-strong:#1F4D1C;
    --sage-bg-strong:#CFE6C8;
    --slate:#2E5A88;
    --slate-bg:#E2EBF5;
    --edit-hover-line:#1D5FA8;
    --field-bg:#FFFFFF;
    --action:#1D5FA8;
    --action-hover:#174C87;
    --action-ink:#1D5FA8;
    --del:#A70E13;
    --del-line:#A70E13;
    --del-bg:#FBE8E9;
    --del-strong:#7A0A0E;
    --del-bg-strong:#F6D2D4;
    --radius:10px;
    --serif: Calibri, "Segoe UI", Georgia, serif;
    --sans: Calibri, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --on-bg:#FFFFFF;
      --on-bg-soft:#B8C1C7;
      --on-bg-line:#333333;
      --card:#353D43;
      --card-line:#A70E13;
      --line:#4A545B;
      --line-strong:#7C8790;
      --hover:#434C53;
      --neutral-bg:#454E55;
      --backdrop:rgba(0,0,0,0.6);
      --ink:#FFFFFF;
      --ink-soft:#E4E8EB;
      --ink-faint:#B8C1C7;
      --accent:#A70E13;
      --accent-hover:#C0151B;
      --accent-ink:#FF6B6F;
      --hover-ink:#FF6B6F;
      --accent-bg:#4A2A2E;
      --on-accent:#FFFFFF;
      --rust:#FF9D66;
      --rust-bg:#4E3325;
      --rust-strong:#FFB085;
      --rust-bg-strong:#4E3325;
      --gold:#E7C07E;
      --gold-bg:#4A3D22;
      --sage:#C6E0BE;
      --sage-bg:#2E4630;
      --sage-strong:#D6EBCF;
      --sage-bg-strong:#3A5A3C;
      --slate:#C9D6E6;
      --slate-bg:#2E3C4B;
      --edit-hover-line:#6FA8E8;
      --field-bg:#000000;
      --action:#2F6DB5;
      --action-hover:#3B7BC4;
      --action-ink:#6FA8E8;
      --del:#FF8E91;
      --del-line:#FF6B6F;
      --del-bg:#4A2A2E;
      --del-strong:#FFA3A6;
      --del-bg-strong:#5C3238;
    }
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  a{color:var(--action-ink);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    padding:clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px) 60px;
  }
  .wrap{max-width:min(1200px, 96vw);margin:0 auto;}
  header{margin-bottom:28px;}
  h1{
    color:var(--on-bg);
    font-family:var(--serif);
    font-weight:700;
    font-size:31px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .sub{color:var(--on-bg-soft);font-size:16px;margin:0;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
    margin:22px 0 26px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .stat .n{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1;}
  .stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
  }
  .toolbar h2{
    color:var(--on-bg);
    font-family:var(--serif);
    font-size:19px;
    font-weight:500;
    margin:0;
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    padding:8px 14px;
    color:var(--ink);
  }
  button:hover{border-color:var(--ink-faint);}

  .btn-primary{
    background:var(--action);
    border-color:var(--action);
    color:#FFFFFF;
  }
  .btn-primary:hover{background:var(--action-hover);border-color:var(--action-hover);}
  .btn-text{
    display:inline-flex;
    align-items:center;
    gap:5px;
    height:28px;
    padding:0 10px;
    font-size:13px;
    line-height:1;
    border-radius:6px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  
  .btn-text svg{width:15px;height:15px;flex-shrink:0;}
  .btn-text.danger{color:var(--del);border-color:var(--del-line);background:var(--del-bg);}
  
  .btn-text.ok{color:var(--sage);border-color:var(--sage);background:var(--sage-bg);}
  
  .cert-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

  .empty{
    background:var(--card);
    border:1px dashed var(--card-line);
    border-radius:var(--radius);
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty p{margin:0 0 14px;font-size:16px;}

  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:14px;
  }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    background:var(--hover);
    overflow-wrap:break-word;
  }
  tbody td{
    padding:12px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--hover);}
  .cert-name{font-weight:500;font-family:var(--serif);font-size:16px;}
  .muted{color:var(--ink-soft);}
  .pill{
    font-size:12px;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
    font-weight:600;
    display:inline-block;
  }
  .pill-notstarted{background:var(--neutral-bg);color:var(--ink-soft);}
  .pill-inprogress{background:var(--slate-bg);color:var(--slate);}
  .pill-submitted{background:var(--slate-bg);color:var(--slate);}
  .pill-underreview{background:var(--gold-bg);color:var(--gold);}
  .pill-approved{background:var(--sage-bg);color:var(--sage);}
  .pill-rejected{background:var(--rust-bg);color:var(--rust);}
  .pill-onhold{background:var(--neutral-bg);color:var(--ink-soft);}
  .pill-overdue{background:var(--rust-bg);color:var(--rust);}
  .pill-slate{background:var(--slate-bg);color:var(--slate);margin-right:6px;}
  .pill-gold{background:var(--gold-bg);color:var(--gold);margin-right:6px;}
  .pill-sage{background:var(--sage-bg);color:var(--sage);margin-right:6px;}
  .due-cell.overdue{color:var(--rust);font-weight:600;}
  .actions-cell{white-space:nowrap;}
  .change-cell{max-width:220px;}
  .doc-loc{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:4px;
    word-break:break-all;
    user-select:all;
  }
  .doc-loc a{color:var(--action-ink);text-decoration:underline;}
  .field-grid .fv a{color:var(--action-ink);text-decoration:underline;}

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    border-bottom:1px solid var(--line);
    padding-bottom:0;
    margin-bottom:16px;
  }
  .tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid transparent;
    border-bottom:none;
    border-radius:8px 8px 0 0;
    background:none;
    color:var(--ink-soft);
    font-family:var(--serif);
    font-size:15px;
    cursor:pointer;
  }
  
  .tab.active{
    color:var(--ink);
    background:var(--card);
    border-color:var(--line);
    font-weight:500;
  }
  .tab.active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background:var(--card);
  }
  .tab-count{
    font-size:12px;
    background:var(--slate-bg);
    color:var(--slate);
    padding:1px 7px;
    border-radius:99px;
    font-weight:600;
  }
  .tab-overdue-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--rust);
    display:inline-block;
  }
  .tab-panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    padding:6px 16px 14px;
  }
  .cgroup-add{padding-top:6px;}
  .cert-block{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cert-block:last-child{border-bottom:none;}
  .cert-block-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .cert-collapse-toggle{
    width:100%;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    text-align:left;
    font-family:var(--sans);
    color:var(--ink);
  }
  .cert-collapse-toggle:hover .cert-name{color:var(--action-ink);}
  .cert-collapse-toggle .chevron{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    margin-right:6px;
    transition:transform 0.15s ease;
  }
  .cert-collapse-toggle .chevron.open{transform:rotate(90deg);}
  .serial-heading{
    font-family:var(--serif);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:16px 0 4px;
  }
  .serial-heading:first-child{margin-top:0;}
  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:10px 20px;
    margin-top:10px;
    font-size:14px;
  }
  .field-grid .fk{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:2px;
  }
  .field-grid .fv{color:var(--ink);}
  .field-grid .full{grid-column:1 / -1;}
  .inline-edit-row{margin-top:2px;}
  .inline-input{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--field-bg);
    color:var(--ink);
  }
  .inline-input:focus{border-color:var(--action-ink);outline:none;}
  .changelog{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .changelog-entry{
    display:flex;
    gap:10px;
    font-size:15px;
    padding:3px 0;
  }
  .changelog-date{
    font-size:13px;
    padding-top:1px;
    color:var(--ink-faint);
    min-width:80px;
    flex-shrink:0;
  }
  .changelog-text{color:var(--ink-soft);}
  .activity-entry{
    font-size:15px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .activity-entry:last-child{border-bottom:none;}
  .activity-entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .late-note{color:var(--ink-faint);font-style:italic;}
  .activity-meta{
    font-size:13px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .modal-bg{
    position:fixed;inset:0;
    background:var(--backdrop);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    z-index:10;
    overflow-y:auto;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    max-width:min(520px, 92vw);
    width:100%;
  }
  .modal h3{
    font-family:var(--serif);
    font-weight:500;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--sans);
    font-size:16px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--field-bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
  .err{color:var(--rust);font-size:13px;margin-top:4px;display:none;}
  .loading{color:var(--on-bg-soft);font-size:14px;padding:20px 0;}

  @media (max-width: 640px){
    .field-grid{grid-template-columns:1fr;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;}
    .tab{flex-shrink:0;}
  }
  .sync-banner{
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .sync-banner.info{background:var(--slate-bg);color:var(--slate);border-color:var(--slate);}
  .sync-banner.error{background:var(--rust-bg);color:var(--rust);border-color:var(--rust);}
  .sync-banner.success{background:var(--sage-bg);color:var(--sage);border-color:var(--sage);}
  .sync-banner a{color:inherit;text-decoration:underline;}
  .version-footer{
    margin-top:24px;
    padding-top:12px;
    border-top:1px solid var(--on-bg-line);
    font-size:11px;
    color:var(--on-bg-soft);
    text-align:center;
  }
  /* v2.2.0 sidebar layout */
  .layout{
    display:grid;
    grid-template-columns:minmax(220px, 290px) minmax(0, 1fr);
    gap:16px;
    align-items:start;
  }
  .sidebar{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:6px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  .side-customer-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    border-radius:8px;
    padding:10px;
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink-soft);
    text-align:left;
  }
  
  .side-customer.has-active .side-customer-btn{color:var(--ink);font-weight:700;}
  .side-customer.has-active .side-customer-name{color:var(--hover-ink);font-weight:700;}
  .side-customer-name{flex:1;min-width:0;overflow-wrap:break-word;}
  .sidebar .chevron{
    display:inline-block;
    font-size:12px;
    color:var(--ink-faint);
    transition:transform 0.15s ease;
  }
  .sidebar .chevron.open{transform:rotate(90deg);}
  .side-certs{padding:0 0 8px 18px;}
  .side-serial{
    font-size:11px;
    font-weight:600;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:8px 10px 2px;
  }
  .side-cert{
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:8px;
    background:none;
    border:none;
    border-radius:6px;
    padding:7px 10px;
    font-size:14px;
    color:var(--ink-soft);
    text-align:left;
  }
  
  .side-cert.active{background:var(--hover);}
  .side-cert-name{flex:1;min-width:0;overflow-wrap:break-word;}
  .side-cert-auth{display:block;font-size:13px;color:var(--ink-faint);}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
  .dot-overdue{background:var(--rust);}
  .dot-gold{background:var(--gold);}
  .dot-slate{background:var(--slate);}
  .dot-sage{background:var(--sage);}
  .side-add{font-size:13px;margin:4px 0 0 6px;}
  .detail{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--radius);
    padding:16px 20px 18px;
    min-width:0;
    scroll-margin-top:12px;
  }
  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .detail-context{font-size:13px;color:var(--ink-faint);margin-bottom:2px;}
  .detail-title{
    font-family:var(--serif);
    font-size:22px;
    font-weight:600;
    margin:0;
    line-height:1.2;
  }
  .activity-entry-top > :first-child{min-width:0;overflow-wrap:anywhere;}
  .activity-entry-top .cert-actions{flex-shrink:0;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    padding:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--accent);
  }
  .detail-actions{display:flex;justify-content:flex-end;margin-top:4px;}
  button:focus-visible{outline:2px solid var(--action-ink);outline-offset:2px;}
  @media (max-width: 760px){
    .layout{grid-template-columns:1fr;}
    .sidebar{position:static;max-height:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .sidebar .chevron{transition:none;}
  }
  /* Hover: grey shading; customer names turn bold Redbird red; button borders take their color */
  .side-customer-btn:hover{background:var(--hover);}
  .side-customer-btn:hover .side-customer-name{color:var(--hover-ink);font-weight:700;}
  .side-cert:hover{background:var(--hover);}
  .btn-text:hover{background:var(--hover);color:var(--ink);border-color:var(--edit-hover-line);}
  .btn-text.danger:hover{background:var(--del-bg-strong);color:var(--del);border-color:var(--del-strong);}
  a.btn-text{text-decoration:none;}
  .btn-text.ok:hover{background:var(--sage-bg-strong);color:var(--sage);border-color:var(--sage-strong);}
  .icon-btn:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  /* Dark mode sidebar: selected customer gets a Redbird red highlight; text stays white */
  @media (prefers-color-scheme: dark){
    .side-customer.has-active .side-customer-btn,
    .side-customer.has-active .side-customer-btn:hover{background:var(--accent);color:#FFFFFF;}
    .side-customer.has-active .side-customer-name,
    .side-customer.has-active .side-customer-btn:hover .side-customer-name{color:#FFFFFF;font-weight:700;}
    .side-customer.has-active .chevron{color:#FFFFFF;}
    .side-customer-btn:hover .side-customer-name{color:var(--ink);font-weight:700;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <h1>Certification Project Tracker</h1>
      <p class="sub">View only</p>
    </div>
    <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>

  <div class="stats" id="stats"></div>

  <div id="sync-banner" class="sync-banner" style="display:none;"></div>

  <div id="list"><div class="loading">Loading&hellip;</div></div>
  <div class="version-footer">v2.4.4</div>
</div>

<div class="modal-bg" id="settings-modal-bg">
  <div class="modal">
    <h3>Sign in to edit</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-top:-8px;">Enter a GitHub token with write access to open the editor. Your token is kept only in this browser's local storage — never written into the page or committed to the repo.</p>
    <div class="field">
      <label for="s-owner">Repo owner (user or org)</label>
      <input id="s-owner" placeholder="e.g. octocat">
    </div>
    <div class="field">
      <label for="s-repo">Repository name</label>
      <input id="s-repo" placeholder="e.g. certification-tracker">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="s-branch">Branch</label>
        <input id="s-branch" placeholder="main">
      </div>
      <div class="field">
        <label for="s-path">File path</label>
        <input id="s-path" placeholder="data/certifications.json">
      </div>
    </div>
    <div class="field">
      <label for="s-token">Personal access token (repo write scope)</label>
      <input id="s-token" type="password" placeholder="ghp_...">
    </div>
    <div class="err" id="settings-err" style="display:none;"></div>
    <div class="modal-actions">
      <button id="settings-cancel-btn">Cancel</button>
      <button class="btn-primary" id="settings-save-btn">Connect &amp; open editor</button>
    </div>

<script>
let certs = [];
let activeCustomer = null;
let activeCertId = null;
let expandedCustomers = new Set();
let sidebarInitialised = false;
let currentSha = null;

// Hardcoded, read-only connection to the public data repo.
const ghConfig = {
  owner: 'wjen5116',
  repo: 'Certification-Projects',
  branch: 'main',
  path: 'data/certifications.json',
  token: ''
};

function showBanner(kind, html){
  const el = document.getElementById('sync-banner');
  el.className = 'sync-banner ' + kind;
  el.innerHTML = html;
  el.style.display = 'block';
}

function hideBanner(){
  document.getElementById('sync-banner').style.display = 'none';
}

// UTF-8 safe base64 encode/decode
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

function ghHeaders(){
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  if(ghConfig.token) headers['Authorization'] = 'Bearer ' + ghConfig.token;
  return headers;
}

function ghUrl(){
  return `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${encodeURIComponent(ghConfig.path).replace(/%2F/g,'/')}`;
}

async function fetchFromGitHub(){
  const res = await fetch(ghUrl() + `?ref=${encodeURIComponent(ghConfig.branch)}`, {
    headers: ghHeaders()
  });
  if(res.status === 404){
    return null; // file doesn't exist yet
  }
  if(!res.ok){
    const body = await res.text();
    throw new Error(`GitHub read failed (${res.status}): ${body.slice(0,200)}`);
  }
  const json = await res.json();
  currentSha = json.sha;
  const content = b64DecodeUtf8(json.content.replace(/\n/g,''));
  return JSON.parse(content);
}

async function load(){
  try{
    showBanner('info', 'Loading from GitHub&hellip;');
    const remote = await fetchFromGitHub();
    if(remote === null){
      certs = [];
      showBanner('error', 'No data file found at that path yet.');
    }else{
      certs = remote;
      hideBanner();
    }
  }catch(e){
    showBanner('error', 'Could not load from GitHub: ' + escapeHtml(e.message));
    certs = [];
  }
  render();
}

function statusPillClass(){ return ''; }

function isOverdue(c){
  if(!c.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(c.date + 'T00:00:00');
  return d < today;
}

function fmtDate(d){
  if(!d) return '\u2014';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

function render(){
  const stats = document.getElementById('stats');
  const total = certs.length;
  const overdue = certs.filter(isOverdue).length;
  const dueSoon = certs.filter(c => {
    if(!c.date || isOverdue(c)) return false;
    const d = new Date(c.date + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = (d - today) / 86400000;
    return diff >= 0 && diff <= 30;
  }).length;
  const noDate = certs.filter(c => !c.date).length;

  stats.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${overdue}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="n">${dueSoon}</div><div class="l">Due in 30 days</div></div>
    <div class="stat"><div class="n">${noDate}</div><div class="l">No due date</div></div>
  `;

  const list = document.getElementById('list');
  if(certs.length === 0){
    list.innerHTML = `<div class="empty"><p>No certifications found.</p></div>`;
    return;
  }

  const groups = {};
  const order = [];
  certs.forEach(c => {
    const key = (c.customer || 'Unassigned').trim() || 'Unassigned';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });

  const CUSTOMER_ORDER = ['skyborne airline academy', 'skyborn airline academy', 'us aviation academy', 'aeroguard', 'superior air'];
  order.sort((a,b) => {
    const ai = CUSTOMER_ORDER.indexOf(a.trim().toLowerCase());
    const bi = CUSTOMER_ORDER.indexOf(b.trim().toLowerCase());
    const aRank = ai === -1 ? CUSTOMER_ORDER.length : ai;
    const bRank = bi === -1 ? CUSTOMER_ORDER.length : bi;
    if(aRank !== bRank) return aRank - bRank;
    return a.localeCompare(b);
  });

  // Resolve the selected certification; fall back to the first one for the current customer
  let activeCert = certs.find(x => x.id === activeCertId);
  if(!activeCert){
    const fallbackCustomer = (activeCustomer && order.includes(activeCustomer)) ? activeCustomer : order[0];
    activeCert = sortCerts(groups[fallbackCustomer])[0];
    activeCertId = activeCert.id;
  }
  activeCustomer = customerKey(activeCert);
  if(!sidebarInitialised){
    expandedCustomers.add(activeCustomer);
    sidebarInitialised = true;
  }

  const sidebar = order.map(customer => {
    const items = sortCerts(groups[customer]);
    const anyOverdue = items.some(isCertOverdue);
    const open = expandedCustomers.has(customer);
    const { groups: sg, order: so } = groupBySerial(items);
    const showSerial = so.length > 1;
    return `
      <div class="side-customer ${customer === activeCustomer ? 'has-active' : ''}">
        <button class="side-customer-btn" aria-expanded="${open}" onclick="toggleCustomer('${escapeAttr(customer)}')">
          <span class="chevron ${open ? 'open' : ''}" aria-hidden="true">&#9656;</span>
          <span class="side-customer-name">${escapeHtml(customer)}</span>
          ${anyOverdue ? '<span class="tab-overdue-dot" title="Has overdue items"></span>' : ''}
          <span class="tab-count">${items.length}</span>
        </button>
        ${open ? `
        <div class="side-certs">
          ${so.map(sk => `
            ${sg[sk].map(x => {
              const st = computeCertStatus(x);
              const isActive = x.id === activeCertId;
              return `
              <button class="side-cert ${isActive ? 'active' : ''}" ${isActive ? 'aria-current="true"' : ''} title="${escapeHtml(certName(x))}" onclick="selectCert('${x.id}')">
                <span class="status-dot dot-${st.cls}" title="${st.label}"></span>
                <span class="side-cert-name">SN: ${escapeHtml(x.serial || '\u2014')}${(x.authority || x.level) ? `<span class="side-cert-auth">${escapeHtml([x.authority, x.level].filter(Boolean).join(' - '))}</span>` : ''}${x.aircraft ? `<span class="side-cert-auth">${escapeHtml(x.aircraft)}</span>` : ''}</span>
              </button>`;
            }).join('')}
          `).join('')}
        </div>` : ''}
      </div>
    `;
  }).join('');

  const c = activeCert;
  const over = isOverdue(c);
  const status = computeCertStatus(c);

  list.innerHTML = `
    <div class="layout">
      <nav class="sidebar" aria-label="Customers and certifications">${sidebar}</nav>
      <section class="detail" id="detail" aria-live="polite">
        <div class="detail-head">
          <div>
            <div class="detail-context">${escapeHtml(activeCustomer)}${c.serial ? ' / ' + escapeHtml(c.serial) : ''}</div>
            <h2 class="detail-title">${escapeHtml(certName(c))}</h2>
          </div>
          <span class="pill pill-${status.cls}">${status.label}</span>
        </div>
        <div class="field-grid">
          <div>
            <div class="fk">SIM location</div>
            <div class="fv">${escapeHtml(c.simLocation || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">Certifying country</div>
            <div class="fv">${escapeHtml(c.country || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">Regulatory authority</div>
            <div class="fv">${escapeHtml(c.authority || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">SIM serial number</div>
            <div class="fv">${escapeHtml(c.serial || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">SIM model</div>
            <div class="fv">${escapeHtml(certModel(c) || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">Aircraft type</div>
            <div class="fv">${escapeHtml(c.aircraft || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">Certification level</div>
            <div class="fv">${escapeHtml(c.level || '\u2014')}</div>
          </div>
          <div>
            <div class="fk">Due date</div>
            <div class="fv ${over ? 'due-cell overdue' : ''}">${fmtDate(c.date)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}</div>
          </div>
          <div>
            <div class="fk">Primary contact</div>
            <div class="fv">${escapeHtml(c.primaryContact || '\u2014')}</div>
          </div>
        </div>
        ${renderDocumentsSection(c)}
        ${renderDocChangeLog(c)}
        ${renderActivityLog(c)}
      </section>
    </div>
  `;
}

function isCertOverdue(c){
  if(isOverdue(c)) return true;
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  return acts.some(isActivityOverdue);
}

function computeCertStatus(c){
  if(isCertOverdue(c)) return {label: 'Overdue', cls: 'overdue'};
  const acts = Array.isArray(c.activityLog) ? c.activityLog : [];
  if(acts.length === 0) return {label: 'No Activity', cls: 'slate'};
  const anyOpen = acts.some(a => a.status !== 'Complete');
  if(anyOpen) return {label: 'In Progress', cls: 'gold'};
  return {label: 'On Track', cls: 'sage'};
}

function sortCerts(items){
  return [...items].sort((a,b) => {
    const aOver = isCertOverdue(a) ? 0 : 1;
    const bOver = isCertOverdue(b) ? 0 : 1;
    if(aOver !== bOver) return aOver - bOver;
    const ad = a.date || '9999-99-99';
    const bd = b.date || '9999-99-99';
    return ad.localeCompare(bd);
  });
}

function groupBySerial(items){
  const groups = {};
  const order = [];
  items.forEach(c => {
    const key = c.serial || 'No serial number';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(c);
  });
  return { groups, order };
}

// ---- Automatic certification name and SIM model ----
// SIM model is read from the serial: skip a leading "R-" prefix, take the letters before the digits
// (R-MCX-100251 -> MCX, FMX-0297 -> FMX). A typed model overrides it.
function detectModel(serial){
  const m = String(serial || '').trim().toUpperCase().match(/^(?:R-)?([A-Z]+)(?=[-\s]?\d)/);
  return m ? m[1] : '';
}

function certModel(c){
  return (c.simModel || '').trim() || detectModel(c.serial);
}

// "Authority Level - Aircraft (Model)", e.g. "UKCAA FNPT II - Piper PA-28-181 Archer (MCX)"
function autoName(c){
  let n = [c.authority, c.level].map(x => (x || '').trim()).filter(Boolean).join(' ');
  const aircraft = (c.aircraft || '').trim();
  if(aircraft) n = n ? `${n} - ${aircraft}` : aircraft;
  const model = certModel(c);
  if(model) n = n ? `${n} (${model})` : model;
  return n;
}

// Existing certifications (no nameAuto flag) keep their typed names as overrides.
function certName(c){
  if(c.nameAuto) return autoName(c) || c.name || 'Untitled certification';
  return c.name || autoName(c) || 'Untitled certification';
}

function customerKey(c){
  return (c.customer || 'Unassigned').trim() || 'Unassigned';
}

function toggleCustomer(name){
  if(expandedCustomers.has(name)) expandedCustomers.delete(name);
  else expandedCustomers.add(name);
  render();
}

function selectCert(id){
  activeCertId = id;
  render();
  if(window.matchMedia('(max-width: 760px)').matches){
    const d = document.getElementById('detail');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(d) d.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
  }
}

function escapeAttr(s){
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

const ICON = {
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};

// "View" button: opens a document's link in a new tab (only for documents that have a link).
function viewBtn(doc){
  const url = typeof doc === 'string' ? '' : (doc.url || '');
  if(!url) return '';
  return `<a class="btn-text compact" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="View" aria-label="View">${ICON.eye}<span class="btn-label">View</span></a>`;
}

function renderDocumentsSection(c){
  const docs = Array.isArray(c.docs) ? c.docs : [];
  return `
    <div class="changelog">
      <div class="fk">Documents</div>
      ${docs.length ? docs.map(d => `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <span class="changelog-text">${renderDocItem(d)}</span>
            ${viewBtn(d) ? `<div class="cert-actions">${viewBtn(d)}</div>` : ''}
          </div>
        </div>
      `).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No documents yet</span></div>'}
      ${c.docLocation ? `<div class="activity-entry-top" style="margin-top:6px;">${renderDocLocation(c.docLocation)}</div>` : ''}
    </div>
  `;
}

function renderDocChangeLog(c){
  const entries = Array.isArray(c.docChangeLog) ? c.docChangeLog : [];
  const sorted = [...entries].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.ts || 0) - (a.ts || 0));
  return `
    <div class="changelog">
      <div class="fk">Document Change Log</div>
      ${sorted.length ? sorted.map(entry => `
        <div class="changelog-entry">
          <span class="changelog-date">${fmtDate(entry.date)}${entry.time ? ', ' + entry.time : ''}</span>
          <span class="changelog-text">${escapeHtml(entry.text)}</span>
        </div>
      `).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No entries yet</span></div>'}
    </div>
  `;
}

// For completed activities: how many days after the due date they were completed ('' if on time or unknown).
function lateNote(a){
  if(a.status !== 'Complete' || !a.dateDue || !a.dateCompleted) return '';
  const days = Math.round((new Date(a.dateCompleted + 'T00:00:00') - new Date(a.dateDue + 'T00:00:00')) / 86400000);
  if(days <= 0) return '';
  return ` <span class="late-note">(${days} day${days === 1 ? '' : 's'} late)</span>`;
}

function isActivityOverdue(a){
  if(a.status === 'Complete') return false;
  if(!a.dateDue) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(a.dateDue + 'T00:00:00') < today;
}

function activityStatusClass(status){
  if(status === 'Complete') return 'sage';
  if(status === 'In Progress') return 'gold';
  return 'slate';
}

function renderActivityLog(c){
  const entries = Array.isArray(c.activityLog) ? c.activityLog : [];
  const sorted = [...entries].sort((a,b) => {
    const aDone = a.status === 'Complete' ? 1 : 0;
    const bDone = b.status === 'Complete' ? 1 : 0;
    if(aDone !== bDone) return aDone - bDone;
    const ad = a.dateDue || a.dateCreated || '';
    const bd = b.dateDue || b.dateCreated || '';
    return aDone === 0 ? ad.localeCompare(bd) : bd.localeCompare(ad);
  });
  return `
    <div class="changelog">
      <div class="fk">Activities</div>
      ${sorted.length ? sorted.map(a => {
        const over = isActivityOverdue(a);
        const status = a.status || 'Pending';
        const cls = activityStatusClass(status);
        return `
        <div class="activity-entry">
          <div class="activity-entry-top">
            <div>
              <span class="pill pill-${cls}">${escapeHtml(status)}</span>
              <span class="changelog-text">${escapeHtml(a.description || a.text || '')}</span>
            </div>
          </div>
          <div class="activity-meta">
            Entered ${fmtDate(a.dateCreated)}${a.timeCreated ? ', ' + a.timeCreated : ''}
            ${a.dateDue ? ` \u00b7 Due ${fmtDate(a.dateDue)}${over ? ' <span class="pill pill-overdue">Overdue</span>' : ''}` : ''}
            ${a.dateUpdated && a.dateUpdated !== a.dateCreated ? ` \u00b7 Updated ${fmtDate(a.dateUpdated)}${a.timeUpdated ? ', ' + a.timeUpdated : ''}` : ''}
            ${a.dateCompleted ? ` \u00b7 Completed ${fmtDate(a.dateCompleted)}${a.timeCompleted ? ', ' + a.timeCompleted : ''}${lateNote(a)}` : ''}
          </div>
        </div>
      `; }).join('') : '<div class="changelog-entry"><span class="changelog-text" style="color:var(--ink-faint)">No activities yet</span></div>'}
    </div>
  `;
}


function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function renderDocLocation(loc){
  if(!loc) return '';
  const isUrl = /^https?:\/\//i.test(loc.trim());
  if(isUrl){
    return `<div class="doc-loc"><a href="${escapeHtml(loc.trim())}" target="_blank" rel="noopener noreferrer">${escapeHtml(loc.trim())}</a></div>`;
  }
  return `<div class="doc-loc">${escapeHtml(loc)}</div>`;
}

function renderDocItem(doc){
  const name = typeof doc === 'string' ? doc : (doc.name || '');
  return escapeHtml(name);
}

// ---- Sign-in to the editor (project-management.html) ----
const SETTINGS_KEY = 'gh_cert_tracker_settings';
const FILE_PATH_DEFAULT = 'data/certifications.json';

function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}

function saveSettings(cfg){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(cfg));
}

function showSettingsError(msg){
  const el = document.getElementById('settings-err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function openSettings(message){
  const cfg = loadSettings() || {};
  document.getElementById('s-owner').value = cfg.owner || ghConfig.owner;
  document.getElementById('s-repo').value = cfg.repo || ghConfig.repo;
  document.getElementById('s-branch').value = cfg.branch || ghConfig.branch;
  document.getElementById('s-path').value = cfg.path || ghConfig.path;
  document.getElementById('s-token').value = cfg.token || '';
  showSettingsError(message || '');
  document.getElementById('settings-modal-bg').classList.add('open');
  document.getElementById('s-token').focus();
}

function closeSettings(){
  document.getElementById('settings-modal-bg').classList.remove('open');
}

// Confirms the token can reach the repo and write to it. Returns an error message, or '' if OK.
async function verifyCredentials(cfg){
  const headers = {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Authorization': 'Bearer ' + cfg.token
  };
  let res;
  try{
    res = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, {headers});
  }catch(e){
    return 'Could not reach GitHub. Check your connection and try again.';
  }
  if(res.status === 401) return 'GitHub rejected this token. Check it has not expired or been revoked.';
  if(res.status === 403) return 'GitHub refused access with this token (403). It may be rate-limited or blocked by organisation policy.';
  if(res.status === 404) return `Repo ${cfg.owner}/${cfg.repo} was not found, or this token cannot access it.`;
  if(!res.ok) return `GitHub check failed (${res.status}).`;
  const repo = await res.json();
  if(repo.permissions && repo.permissions.push === false){
    return 'This token can read the repo but does not have write access. Use a token with Contents: read and write.';
  }
  return '';
}

document.getElementById('settings-btn').addEventListener('click', () => openSettings());
document.getElementById('settings-cancel-btn').addEventListener('click', closeSettings);
document.getElementById('settings-modal-bg').addEventListener('click', (e) => {
  if(e.target.id === 'settings-modal-bg') closeSettings();
});
document.getElementById('settings-save-btn').addEventListener('click', async () => {
  const owner = document.getElementById('s-owner').value.trim();
  const repo = document.getElementById('s-repo').value.trim();
  const branch = document.getElementById('s-branch').value.trim() || 'main';
  const path = document.getElementById('s-path').value.trim() || FILE_PATH_DEFAULT;
  const token = document.getElementById('s-token').value.trim();
  if(!owner || !repo || !token){
    showSettingsError('Owner, repo, and token are required.');
    return;
  }
  const btn = document.getElementById('settings-save-btn');
  btn.disabled = true;
  btn.textContent = 'Checking\u2026';
  showSettingsError('');
  const cfg = {owner, repo, branch, path, token};
  const problem = await verifyCredentials(cfg);
  btn.disabled = false;
  btn.textContent = 'Connect & open editor';
  if(problem){
    showSettingsError(problem);
    return;
  }
  saveSettings(cfg);
  location.href = 'project-management.html';
});

// Arriving from the editor (no credentials, or the saved token was rejected)
(function(){
  const params = new URLSearchParams(location.search);
  if(params.get('settings') === '1'){
    openSettings(params.get('reason') === 'rejected'
      ? 'GitHub rejected the saved token. Enter a valid token to open the editor.'
      : '');
    history.replaceState(null, '', location.pathname);
  }
})();

load();
</script>
</body>
</html>
